name: post_perpetuo
on:
  workflow_dispatch:
jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post 100% @fc_constroi BR -> @fcconstruye ES 5 redes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          pip install requests yt-dlp -q
          python - << 'PY'
          import os, requests, subprocess
          SUPA_URL=os.getenv("SUPABASE_URL")
          SUPA_KEY=os.getenv("SUPABASE_KEY")
          PAGE_ID=os.getenv("PAGE_ID")
          PAGE_TOKEN=os.getenv("PAGE_TOKEN")
          COOKIES=os.getenv("IG_COOKIES","")
          open('/tmp/cookies.txt','w').write(COOKIES)
          print(f"Cookies tamanho: {len(COOKIES)}")
          print(f"Cookies inicio: {COOKIES[:100]}")
          headers={"apikey": SUPA_KEY, "Authorization": f"Bearer {SUPA_KEY}"}
          r=requests.get(f"{SUPA_URL}/rest/v1/instagram_reels_reais?select=*&order=score.desc&limit=1", headers=headers, timeout=20)
          reel=r.json()[0]
          insta_url=reel.get('url')
          titulo=reel.get('titulo','')
          print(f"URL REAL DO BANCO: {insta_url}")
          # Tenta baixar com timeout de 30s pra nao travar
          try:
              cmd=["yt-dlp","--cookies","/tmp/cookies.txt","--socket-timeout","15","--retries","1","--no-warnings","-o","/tmp/video.mp4",insta_url]
              print(f"Rodando: {' '.join(cmd)}")
              result=subprocess.run(cmd, capture_output=True, text=True, timeout=45)
              print("STDOUT:", result.stdout[-800:])
              print("STDERR:", result.stderr[-800:])
              print("Return code:", result.returncode)
          except subprocess.TimeoutExpired:
              print("⏰ TIMEOUT de 45s - yt-dlp travou, matando")
              subprocess.run(["pkill","-9","yt-dlp"])
          if os.path.exists("/tmp/video.mp4"):
              print(f"OK video {os.path.getsize('/tmp/video.mp4')} bytes")
              with open("/tmp/video.mp4","rb") as f:
                  fb=requests.post(f"https://graph.facebook.com/v20.0/{PAGE_ID}/videos", data={"description": titulo, "access_token": PAGE_TOKEN}, files={"source": f}, timeout=300)
              print(f"FACEBOOK: {fb.status_code} {fb.text[:1000]}")
          else:
              print("❌ NAO BAIXOU - Verifica se a URL no Supabase esta completa")
              print(f"A url atual '{insta_url}' parece invalida, deveria ser tipo https://www.instagram.com/reel/DJxxx/")
          PY
