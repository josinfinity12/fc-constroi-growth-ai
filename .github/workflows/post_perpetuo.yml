name: post_perpetuo_multidestino
on:
  schedule:
    - cron: '0 12,17,22 * * *'
  workflow_dispatch:
jobs:
  post_tudo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instala tudo
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
          pip install instaloader Pillow edge-tts moviepy==1.0.3 yt-dlp requests

      - name: 1. PUXA do @fc_constroi (FONTE)
        env:
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          echo "$IG_COOKIES" > /tmp/cookies.txt
          instaloader --cookies /tmp/cookies.txt --no-captions --no-profile-pic --dirname-pattern=/tmp/insta --filename-pattern="{shortcode}" fc_constroi -- -l 1
          rm /tmp/cookies.txt
          ls /tmp/insta/

      - name: 2. Dublagem + Legenda Poppins Amarela
        run: |
          # aqui entra seu script de dublagem Jorge + legenda
          python scripts/dubla_espanhol.py /tmp/insta/ /tmp/pronto/
          ls /tmp/pronto/

      - name: 3. POSTA @fc_construye (IG DESTINO)
        env:
          IG_COOKIES_CONSTRUYE: ${{ secrets.IG_COOKIES_CONSTRUYE }}
        run: |
          echo "$IG_COOKIES_CONSTRUYE" > /tmp/cookies_construye.txt
          python scripts/post_ig.py --cookies /tmp/cookies_construye.txt --video /tmp/pronto/final.mp4
          rm /tmp/cookies_construye.txt

      - name: 4. POSTA YouTube Shorts
        env:
          YT_CLIENT: ${{ secrets.YOUTUBE_CLIENT }}
        run: |
          echo "$YT_CLIENT" > client_secret.json
          python scripts/post_yt.py --video /tmp/pronto/final.mp4

      - name: 5. POSTA TikTok + Facebook
        env:
          TIKTOK_SESSION: ${{ secrets.TIKTOK_SESSION }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: |
          python scripts/post_tiktok.py --session "$TIKTOK_SESSION" --video /tmp/pronto/final.mp4
          python scripts/post_fb.py --token "$FB_TOKEN" --video /tmp/pronto/final.mp4

      - name: 6. KWAI - PENDENTE
        run: echo "Falta KWAI_TOKEN - video pronto em /tmp/pronto/final.mp4"
