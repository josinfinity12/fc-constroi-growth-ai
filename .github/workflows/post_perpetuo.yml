name: post_perpetuo
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post 100% @fc_constroi BR -> @fcconstruye ES 5 redes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          pip install requests yt-dlp -q
          python - << 'PY'
          import os, requests, subprocess
          SUPA_URL = os.getenv("SUPABASE_URL")
          SUPA_KEY = os.getenv("SUPABASE_KEY")
          PAGE_ID = os.getenv("PAGE_ID")
          PAGE_TOKEN = os.getenv("PAGE_TOKEN")
          COOKIES = os.getenv("IG_COOKIES")
          
          print(f"PAGE_ID:{bool(PAGE_ID)} COOKIES:{bool(COOKIES)}")
          open('/tmp/cookies.txt','w').write(COOKIES or "")
          
          headers = {"apikey": SUPA_KEY, "Authorization": f"Bearer {SUPA_KEY}"}
          r = requests.get(f"{SUPA_URL}/rest/v1/instagram_reels_reais?select=*&order=score.desc&limit=1", headers=headers, timeout=20)
          print(f"Supabase: {r.status_code}")
          reel = r.json()[0]
          insta_url = reel.get('url')
          titulo = reel.get('titulo','')
          print(f"URL: {insta_url}")
          print(f"Titulo: {titulo}")
          
          # Baixa com cookies
          cmd = ["yt-dlp", "--cookies", "/tmp/cookies.txt", "-g", insta_url]
          result = subprocess.run(cmd, capture_output=True, text=True, timeout=90)
          mp4_url = result.stdout.strip().split('\n')[0] if result.stdout else ""
          print(f"MP4: {mp4_url[:150]}")
          if not mp4_url.startswith("http"):
              print(f"yt-dlp falhou: {result.stderr[:500]}")
          else:
              fb = requests.post(f"https://graph.facebook.com/v20.0/{PAGE_ID}/videos", data={"file_url": mp4_url, "description": titulo, "access_token": PAGE_TOKEN}, timeout=120)
              print(f"FACEBOOK POST: {fb.status_code}")
              print(f"FACEBOOK RESP: {fb.text[:1000]}")
              if fb.status_code == 200:
                  print("✅ POSTOU 100% @fcconstruye !!!")
          PY
