      - name: Post 100% @fc_constroi BR -> @fcconstruye ES 5 redes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          pip install requests -q
          python - << 'PY'
          import os, requests
          url = os.getenv("SUPABASE_URL")
          key = os.getenv("SUPABASE_KEY")
          page_id = os.getenv("PAGE_ID")
          page_token = os.getenv("PAGE_TOKEN")
          print(f"PAGE_ID:{bool(page_id)} PAGE_TOKEN:{bool(page_token)} ID_VAL:{page_id}")
          if not page_id or not page_token:
              print("❌ PAGE_ID ou PAGE_TOKEN vazio no GitHub Secrets - arruma os 2 com FB_")
              exit(0)
          headers = {"apikey": key, "Authorization": f"Bearer {key}"}
          r = requests.get(f"{url}/rest/v1/instagram_reels_reais?select=*&order=views.desc&limit=1", headers=headers, timeout=10)
          print(f"Supabase: {r.status_code}")
          data = r.json()
          reel = data[0]
          video_url = reel.get('video_url') or reel.get('url')
          print(f"Video URL raw: {video_url}")
          # Só posta se for .mp4 direto, se for link do Instagram pula pra não travar
          if video_url and "instagram.com" in video_url:
              print("⚠️ Video URL é link do Instagram, não .mp4 - precisa coluna video_url com .mp4 direto no Supabase. Pulando post pra não travar.")
          else:
              fb = requests.post(f"https://graph.facebook.com/v20.0/{page_id}/videos", data={"file_url": video_url, "description": reel.get('caption_es',''), "access_token": page_token}, timeout=30)
              print(f"FACEBOOK: {fb.status_code} {fb.text[:400]}")
          print("DONE")
          PY
