name: post_perpetuo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post 100% @fc_constroi BR -> @fcconstruye ES 5 redes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          pip install requests yt-dlp -q
          python - << 'PY'
          import os, requests, subprocess
          url = os.getenv("SUPABASE_URL")
          key = os.getenv("SUPABASE_KEY")
          page_id = os.getenv("PAGE_ID")
          page_token = os.getenv("PAGE_TOKEN")
          print(f"PAGE_ID:{bool(page_id)} ID_VAL:{page_id}")
          headers = {"apikey": key, "Authorization": f"Bearer {key}"}
          r = requests.get(f"{url}/rest/v1/instagram_reels_reais?select=*&order=views.desc&limit=1", headers=headers, timeout=15)
          print(f"Supabase: {r.status_code}")
          reel = r.json()[0]
          insta_url = reel.get('video_url')
          print(f"Instagram URL: {insta_url}")
          try:
              result = subprocess.run(["yt-dlp", "-g", insta_url], capture_output=True, text=True, timeout=30)
              mp4_url = result.stdout.strip().split('\n')[0]
              print(f"MP4 direto: {mp4_url[:120]}")
              if mp4_url and mp4_url.startswith("http"):
                  fb = requests.post(f"https://graph.facebook.com/v20.0/{page_id}/videos", data={"file_url": mp4_url, "description": reel.get('caption_es','Gaveta inteligente'), "access_token": page_token}, timeout=60)
                  print(f"FACEBOOK: {fb.status_code} {fb.text[:600]}")
              else:
                  print(f"yt-dlp nao retornou mp4: {result.stderr[:300]}")
          except Exception as e:
              print(f"ERRO: {e}")
          print("DONE")
          PY
