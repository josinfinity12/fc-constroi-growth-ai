name: post_perpetuo
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 15 * * *'
    - cron: '0 22 * * *'
jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instala deps viral
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg imagemagick --no-install-recommends
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
          pip install requests gtts moviepy==1.0.3 openai-whisper instaloader
      - name: Roda bot viral 5 redes
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_SYSTEM_TOKEN: ${{ secrets.FB_SYSTEM_TOKEN }}
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          INSTAGRAM_USER: ${{ secrets.INSTAGRAM_USER }}
          INSTAGRAM_PASS: ${{ secrets.INSTAGRAM_PASS }}
        run: |
          mkdir -p videos
          echo "=== ANTES ==="
          ls -lh videos/ || true
          echo "=== BOT ==="
          python auto_post_perpetuo.py 2>&1 || true
          echo "=== DEPOIS ==="
          ls -lh videos/ || true
          cat log_postagens.json || echo "sem log"
          cat ranking_viral.json || echo "sem ranking"
      - name: Salva log viral
        if: always()
        run: |
          git config --global user.name "bot-fc"
          git config --global user.email "bot@fc.com"
          touch log_postagens.json ranking_viral.json
          git add log_postagens.json ranking_viral.json || true
          git diff --staged --quiet || git commit -m "viral post $(date)" || true
          git push || true
