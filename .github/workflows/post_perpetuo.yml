def traduzir(texto):
    mapa = {"ERRO de R$8mil em gaveta porcelanato - 95% erram": "ERROR de $8000 en gaveta porcelanato - 95% cometen", "Fature 10k com pia de banheiro 90x90": "Factura $10k con lavabo de baño 90x90", "Base armário que aguenta 300kg sem empenar": "Base de armario que aguanta 300kg sin pandear", "Você tá perdendo R$8mil em cada gaveta por causa disso": "¡Estás perdiendo $8000 en cada gaveta por esto!"}
    for pt, es in mapa.items():
        if pt.lower() in texto.lower(): texto = texto.replace(pt, es)
    return texto.replace("R$", "$")

