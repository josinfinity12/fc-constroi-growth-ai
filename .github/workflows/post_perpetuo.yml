name: Atualiza @fc_constroi REAL TIME
on:
  schedule:
    - cron: '0 6 * * *' # 06h Bahia
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps REAL TIME
        run: |
          pip install --upgrade supabase requests
          pip install supabase==2.10.0
      - name: Atualiza Supabase REAL TIME @fc_constroi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python scripts/atualiza_real_time.py
