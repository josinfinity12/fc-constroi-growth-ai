name: FC Post Perpetuo 5 Redes ES

on:
  schedule:
    - cron: '0 10,15,22 * * *'  # 07:00, 12:00, 19:00 Brasil (10,15,22 UTC)
  workflow_dispatch: # permite clicar em Run now

jobs:
  post-perpetuo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          pip install yt-dlp moviepy gTTS requests
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Rodar auto post perpetuo
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python auto_post_perpetuo.py

      - name: Salvar videos gerados
        uses: actions/upload-artifact@v3
        with:
          name: videos-finais-es
          path: videos_es_final/
          
