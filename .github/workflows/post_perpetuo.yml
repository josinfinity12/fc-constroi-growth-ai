name: post_perpetuo LATAM ES

on:
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          pip install openai instagrapi requests telethon
          sudo apt-get install -y ffmpeg
      - name: 1. Baixa VIDEO - CORRIGIDO
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          cat > /tmp/baixa.py << 'PY'
          import os, random, asyncio
          from telethon import TelegramClient
          async def main():
              api_id = os.getenv("TELEGRAM_API_ID")
              api_hash = os.getenv("TELEGRAM_API_HASH")
              channel = os.getenv("TELEGRAM_CHANNEL") # pode ser @nome ou -100...
              print(f"DEBUG Secrets: API_ID existe? {bool(api_id)}, CHANNEL: {channel}")
              if not api_id or not api_hash or not channel:
                  print("Sem secrets Telegram, tentando usar /tmp/original.mp4 antigo ou video local")
                  # Se ja tem video no repo, usa
                  import pathlib
                  if pathlib.Path("original.mp4").exists():
                      import shutil; shutil.copy("original.mp4","/tmp/original.mp4")
                  else:
                      # Cria um escolha fake pra testar dublagem
                      open("escolha.txt","w").write("top1")
                      # Se nao tem video, baixa um placeholder dos seus tops
                      raise Exception("Faltam TELEGRAM_API_ID / TELEGRAM_CHANNEL nos Secrets do GitHub. Vai em Settings > Secrets and variables > Actions e confere.")
                  return
              
              # Converte ID só se for numero
              try:
                  api_id_int = int(api_id.strip())
              except:
                  api_id_int = int(api_id)
              
              client = TelegramClient('/tmp/session', api_id_int, api_hash.strip())
              await client.start()
              # Aceita tanto @canal quanto ID numerico
              try:
                  chan_entity = int(channel) if channel.strip().lstrip("-").isdigit() else channel.strip()
              except:
                  chan_entity = channel.strip()
                  
              msgs = await client.get_messages(chan_entity, limit=20)
              videos = [m for m in msgs if m.video]
              if not videos:
                  raise Exception(f"Nenhum video no canal {channel}")
              escolha_msg = random.choice(videos[:5])
              escolha = random.choice(["top1","top2","top3"])
              print(f"Baixando video {escolha_msg.id} - transcricao {escolha}")
              open("escolha.txt","w").write(escolha)
              await client.download_media(escolha_msg, "/tmp/original.mp4")
              await client.disconnect()
          asyncio.run(main())
          PY
          python /tmp/baixa.py
          ls -lh /tmp/original.mp4 || echo "original.mp4 nao encontrado"
      - name: 2. DUBLAGEM HOLA AMIGOS
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "import json; d=json.load(open('transcricoes.json')); print(list(d.keys()))"
          cat > /tmp/dublar.py << 'PY'
          import json, subprocess, os
          from openai import OpenAI
          client=OpenAI(api_key=os.getenv("OPENAI_API_KEY"))
          escolha=open("escolha.txt").read().strip() if os.path.exists("escolha.txt") else "top1"
          dados=json.load(open("transcricoes.json"))
          texto_es=dados.get(f"{escolha}_es") or dados["top1_es"]
          if not texto_es.upper().startswith("HOLA AMIGOS"): texto_es="HOLA AMIGOS! "+texto_es
          tts=client.audio.speech.create(model="tts-1", voice="onyx", input=texto_es)
          tts.stream_to_file("/tmp/voz_es.mp3")
          subprocess.run(["ffmpeg","-i","/tmp/original.mp4","-i","/tmp/voz_es.mp3","-map","0:v","-map","1:a","-shortest","-vf","scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920","-c:v","libx264","-preset","ultrafast","-c:a","aac","/tmp/processed_reel.mp4","-y"], check=True)
          PY
          python /tmp/dublar.py
      - name: 3. POSTA @fc_construye
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME_ES }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD_ES }}
        run: |
          cat > /tmp/postar.py << 'PY'
          import json, os
          from instagrapi import Client
          escolha=open("escolha.txt").read().strip(); dados=json.load(open("transcricoes.json")); texto_es=dados[f"{escolha}_es"]
          caption=f"{texto_es[:250]}...\n\n¿Lo harías en tu casa? 👇\n\n#construccion #fcconstruye"
          cl=Client(); cl.login(os.getenv("IG_USERNAME"), os.getenv("IG_PASSWORD")); cl.clip_upload("/tmp/processed_reel.mp4", caption)
          PY
          python /tmp/postar.py
