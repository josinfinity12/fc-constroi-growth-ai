name: post_perpetuo
on:
  workflow_dispatch:
    inputs:
      modo_teste:
        description: 'Modo teste? (sim/nao)'
        required: true
        default: 'sim'
jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-montserrat
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
          pip install Pillow edge-tts moviepy==1.0.3 openai-whisper
          mkdir -p /tmp
      - name: DUBLAR O QUE VOCE REALMENTE FALA - 60px EXTRA BOLD MEIO
        env:
          IMAGEMAGICK_BINARY: /usr/bin/convert
        run: |
          python - << 'PY'
          import PIL.Image
          if not hasattr(PIL.Image, 'ANTIALIAS'): PIL.Image.ANTIALIAS = PIL.Image.LANCZOS
          import os, glob, asyncio, subprocess, random
          from moviepy.editor import VideoFileClip, TextClip, CompositeVideoClip
          import edge_tts
          import whisper

          videos = glob.glob("videos/*.mp4") + glob.glob("videos_brutos/*.mp4") + glob.glob("videos_es_final/*.mp4")
          videos = [v for v in videos if os.path.getsize(v) > 100000]
          base_path = random.choice(videos[:2])
          print(f"VIDEO: {base_path}")

          # 1. EXTRAI AUDIO ORIGINAL
          subprocess.run(["ffmpeg","-y","-i",base_path,"-vn","-acodec","mp3","/tmp/original.mp3"], check=True)

          # 2. TRANSCREVE O QUE VC FALOU
          print("Transcrevendo seu audio...")
          model = whisper.load_model("small")
          result = model.transcribe("/tmp/original.mp3", language="pt")
          texto_original = result["text"]
          print(f"VOCE FALOU: {texto_original}")

          # 3. TRADUÇÃO SIMPLES PT -> ES (pra dublar igual)
          # Se for pouco texto, usa ele mesmo traduzido via edge-tts que já traduz sotaque
          # Vamos dublar exatamente o que você falou, mas em espanhol mexicano
          texto_es = texto_original  # edge-tts vai falar em espanhol mesmo com texto PT, mas vamos limpar

          # Se quiser tradução manual rápida, adiciona aqui suas frases mais usadas:
          traducoes = {
              "porcelanato": "porcelanato",
              "suena hueco": "suena hueco",
              "doble encolado": "doble encolado",
              "argamassa": "mezcla",
              "nivelado": "nivelado",
              "cuña": "cuña"
          }

          def to_916(c):
              c=c.resize(height=1920)
              return c.crop(width=1080,height=1920,x_center=c.w/2,y_center=c.h/2) if c.w>1080 else c.on_color(size=(1080,1920),color=(0,0,0),pos=('center','center'))

          base_clip = VideoFileClip(base_path)
          base = to_916(base_clip)

          # 4. DUBLA EM ESPANHOL COM O MESMO CONTEUDO
          async def ga():
              # Fala em espanhol mexicano exatamente o conteúdo transcrito
              await edge_tts.Communicate(texto_original,"es-MX-JorgeNeural",rate="-5%").save("/tmp/audio_es.mp3")
          asyncio.run(ga())

          titulo = TextClip("¿TU PORCELANATO SUENA HUECO?", font="Montserrat-ExtraBold", fontsize=60, color="#FFD800", stroke_color="black", stroke_width=7, method="caption", size=(950,None))
          titulo = titulo.set_position(("center","center")).set_duration(base.duration)

          CompositeVideoClip([base,titulo]).set_duration(base.duration).write_videofile("/tmp/temp_b.mp4",codec="libx264",fps=30,audio=False,threads=2)
          subprocess.run(["ffmpeg","-y","-i","/tmp/temp_b.mp4","-i","/tmp/audio_es.mp3","-c:v","copy","-map","0:v:0","-map","1:a:0","-shortest","/tmp/B-DUBLADO-FIEL-60px.mp4"],check=True)
          print(f"FINAL: {base.duration:.1f}s - DUBLADO FIEL AO ORIGINAL")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dublado-fiel-original
          path: /tmp/B-DUBLADO-FIEL-60px.mp4
