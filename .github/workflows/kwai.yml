name: Postar no Kwai
on:
  workflow_dispatch:

jobs:
  post-kwai:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar dependências
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      
      - name: Rodar uploader Kwai
        run: python kwai_uploader.py
        env:
          KWAI_COOKIES: ${{ secrets.KWAI_COOKIES }}
