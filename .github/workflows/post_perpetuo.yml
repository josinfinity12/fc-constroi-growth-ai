name: FC Post Perpetuo 5 Redes ES
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,16,21 * * *'

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install deps
        run: |
          pip install moviepy==1.0.3 Pillow gTTS yt-dlp requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/rights="none"/rights="read,write"/g' /etc/ImageMagick-6/policy.xml || true
          echo "ImageMagick instalado"
          
      - name: Run auto post
        env:
          IMAGEMAGICK_BINARY: /usr/bin/convert
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
        run: python auto_post_perpetuo.py
          
      - name: Save progress
        if: always()
        run: |
          git config user.email "bot@fcconstroi.com"
          git config user.name "FC BOT"
          git add log_postagens.json || true
          git commit -m "update log" || true
          git push || true
          
