name: post_perpetuo LATAM HD

on:
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          pip install instagrapi requests
          sudo apt-get install -y ffmpeg
      - name: 1. Baixa do Telegram HD - SEUS 5 VIDEOS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_BACKUP }}
        run: |
          cat > /tmp/baixa.py << 'PY'
          import os, random, requests, sys
          token=os.getenv("TELEGRAM_BOT_TOKEN").strip()
          channel=os.getenv("TELEGRAM_CHANNEL").strip()
          url=f"https://api.telegram.org/bot{token}/getUpdates"
          r=requests.get(url, params={"limit":100}).json()
          file_ids=[]
          for upd in r.get("result",[]):
              post=upd.get("channel_post") or upd.get("message") or {}
              if "video" in post: file_ids.append(post["video"]["file_id"])
          print(f"Videos no seu HD -1004272: {len(file_ids)}")
          if not file_ids: sys.exit(1)
          fid=random.choice(file_ids[-15:])
          fp=requests.get(f"https://api.telegram.org/bot{token}/getFile", params={"file_id":fid}).json()["result"]["file_path"]
          dl=f"https://api.telegram.org/file/bot{token}/{fp}"
          open("/tmp/original.mp4","wb").write(requests.get(dl).content)
          escolha=random.choice(["top1","top2","top3"])
          open("escolha.txt","w").write(escolha)
          print(f"BAIXADO {escolha} {os.path.getsize('/tmp/original.mp4')/1024/1024:.1f} MB")
          PY
          python /tmp/baixa.py
      - name: 2. Prepara Reels 9:16
        run: |
          ffmpeg -y -i /tmp/original.mp4 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -c:v libx264 -preset ultrafast -c:a aac /tmp/processed_reel.mp4
      - name: 3. POSTA @fc_construye LATAM
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME_ES }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD_ES }}
        run: |
          cat > /tmp/postar.py << 'PY'
          import json, os; from instagrapi import Client
          escolha=open("escolha.txt").read().strip(); dados=json.load(open("transcricoes.json"))
          texto_es=dados[f"{escolha}_es"]
          if not texto_es.upper().startswith("HOLA AMIGOS"): texto_es="HOLA AMIGOS! "+texto_es
          caption=f"{texto_es[:280]}\n\n¿Lo harías en tu casa? 👇\n#construccion #fcconstruye"
          cl=Client(); cl.login(os.getenv("IG_USERNAME"), os.getenv("IG_PASSWORD"))
          cl.clip_upload("/tmp/processed_reel.mp4", caption)
          print("POSTADO LATAM HD OK")
          PY
          python /tmp/postar.py
