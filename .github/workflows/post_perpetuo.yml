name: post_perpetuo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instala deps
        run: |
          python -m pip install --upgrade pip
          pip install requests elevenlabs moviepy==1.0.3
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true

      - name: Roda bot
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          python auto_post_perpetuo.py

      - name: Salva log
        run: |
          git config --global user.name "bot-fc"
          git config --global user.email "bot@fc.com"
          git add log_postagens.json || true
          git diff --staged --quiet || git commit -m "log post"
          git push || true
