name: post_perpetuo LATAM ES

on:
  schedule:
    - cron: '0 17 * * *' # 11:00 MX / 12:00 CO-PE / 14:00 AR-CL
    - cron: '0 20 * * *' # 14:00 MX / 15:00 CO-PE / 17:00 AR-CL - PICO
    - cron: '0 1 * * *'  # 19:00 MX / 20:00 CO-PE / 22:00 AR-CL - OURO
  workflow_dispatch:

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          pip install openai instagrapi requests telethon
          sudo apt-get install -y ffmpeg
      - name: 1. Baixa VIDEO
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          cat > /tmp/baixa.py << 'PY'
          import os, random, asyncio
          from telethon import TelegramClient
          async def main():
              api_id=int(os.getenv("TELEGRAM_API_ID")); api_hash=os.getenv("TELEGRAM_API_HASH"); channel=int(os.getenv("TELEGRAM_CHANNEL_ID"))
              client=TelegramClient('/tmp/session', api_id, api_hash); await client.start()
              msgs=await client.get_messages(channel, limit=20); videos=[m for m in msgs if m.video]
              escolha_msg=random.choice(videos[:5]); escolha=random.choice(["top1","top2","top3"])
              open("escolha.txt","w").write(escolha); await client.download_media(escolha_msg, "/tmp/original.mp4"); await client.disconnect()
          asyncio.run(main())
          PY
          python /tmp/baixa.py
      - name: 2. DUBLAGEM HOLA AMIGOS - MANUAL
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > /tmp/dublar.py << 'PY'
          import json, subprocess, os
          from openai import OpenAI
          client=OpenAI(api_key=os.getenv("OPENAI_API_KEY")); escolha=open("escolha.txt").read().strip(); dados=json.load(open("transcricoes.json")); texto_es=dados[f"{escolha}_es"]
          if not texto_es.upper().startswith("HOLA AMIGOS"): texto_es="HOLA AMIGOS! "+texto_es
          tts=client.audio.speech.create(model="tts-1", voice="onyx", input=texto_es); tts.stream_to_file("/tmp/voz_es.mp3")
          subprocess.run(["ffmpeg","-i","/tmp/original.mp4","-i","/tmp/voz_es.mp3","-map","0:v","-map","1:a","-shortest","-vf","scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920","-c:v","libx264","-preset","ultrafast","-c:a","aac","/tmp/processed_reel.mp4","-y"], check=True)
          PY
          python /tmp/dublar.py
      - name: 3. POSTA @fc_construye - LATAM ES
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME_ES }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD_ES }}
        run: |
          cat > /tmp/postar.py << 'PY'
          import json, os
          from instagrapi import Client
          escolha=open("escolha.txt").read().strip(); dados=json.load(open("transcricoes.json")); texto_es=dados[f"{escolha}_es"]
          caption=f"""{texto_es[:250]}...

          ¿Lo harías en tu casa? Deja tu nota del 1 al 10 👇

          #construccion #albañileria #porcelanato #fcconstruye #latam"""
          cl=Client(); cl.login(os.getenv("IG_USERNAME"), os.getenv("IG_PASSWORD")); cl.clip_upload("/tmp/processed_reel.mp4", caption)
          print("Postado LATAM ES OK")
          PY
          python /tmp/postar.py
