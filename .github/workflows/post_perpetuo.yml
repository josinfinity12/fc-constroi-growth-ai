name: post_perpetuo
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instala deps
        run: |
          pip install moviepy==1.0.3 gTTS yt-dlp requests elevenlabs
          sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
      - name: Roda bot
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python auto_post_perpetuo.py
      - name: Salva progresso
        run: |
          git config --global user.name "bot-fc"
          git config --global user.email "bot@fc.construye"
          git add log_postagens.json videos_es_final/ || true
          git diff --staged --quiet || git commit -m "post es"
          git push || true
