name: post_perpetuo

on:
  workflow_dispatch:
    inputs:
      modo_teste:
        description: 'Modo teste? (sim/nao)'
        required: true
        default: 'sim'
        type: choice
        options:
          - sim
          - nao
  schedule:
    - cron: '0 12,17,22 * * *'

jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-montserrat
          # libera ImageMagick no Ubuntu 22.04
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
          pip install --upgrade pip
          pip install Pillow instagrapi edge-tts moviepy==1.0.3
          mkdir -p /tmp
          convert -version

      - name: TOP 3 VIRAIS + GERAR 2 VERSOES
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          FC_ID: ${{ vars.FC_ID || '15036334738' }}
          MODO_TESTE: ${{ inputs.modo_teste || 'sim' }}
          IMAGEMAGICK_BINARY: /usr/bin/convert
        run: |
          python - << 'PY'
          import PIL.Image
          if not hasattr(PIL.Image, 'ANTIALIAS'):
              PIL.Image.ANTIALIAS = PIL.Image.LANCZOS

          import os, time, subprocess, shutil, random, asyncio
          from instagrapi import Client
          from instagrapi.exceptions import ClientThrottledError
          from moviepy.editor import VideoFileClip, TextClip, CompositeVideoClip
          import edge_tts

          SESSION_ID=os.getenv("IG_SESSIONID","").strip()
          USER_ID=int(os.getenv("FC_ID","15036334738"))
          
          cl=Client()
          cl.delay_range=[5,10]
          cl.login_by_sessionid(SESSION_ID)
          print(f"Login OK {cl.username}")
          time.sleep(90)

          medias=None
          for i in range(5):
              try:
                  medias=cl.user_medias_gql(USER_ID, 20)
                  if not medias: medias=cl.user_medias(USER_ID, 20)
                  break
              except ClientThrottledError:
                  time.sleep(600)
              except Exception:
                  time.sleep(60)

          final = "/tmp/video_final.mp4"
          if not medias:
              subprocess.run(["ffmpeg","-y","-f","lavfi","-i","color=c=black:s=1080x1920:d=5","-vf","drawtext=text='AGUARDE 2H':fontcolor=white:fontsize=60:x=(w-text_w)/2:y=(h-text_h)/2", final], check=True)
          else:
              best = sorted(medias, key=lambda x: x.like_count + x.comment_count, reverse=True)[0]
              path = cl.video_download(best.pk, folder="/tmp")
              if os.path.exists(final): os.remove(final)
              shutil.move(path, final)

          print("Gerando #FFD800...")
          clip_base = VideoFileClip(final).subclip(0, min(20, VideoFileClip(final).duration))
          def to_916(c):
              c = c.resize(height=1920)
              return c.crop(width=1080, height=1920, x_center=c.w/2, y_center=c.h/2) if c.w > 1080 else c.on_color(size=(1080,1920), color=(0,0,0), pos=('center','center'))
          base = to_916(clip_base)

          # A - LEGENDADO
          palavras = ["PORCELANATO", "HUECO?", "DOBLE", "ENCOLADO!", "NIVELADO"]
          clips_a = [base]; t=0; dur=base.duration/len(palavras)
          for p in palavras:
              txt = TextClip(p, font="Montserrat-ExtraBold", fontsize=40, color="#FFD800", stroke_color="black", stroke_width=6)
              txt = txt.set_position(("center", 1350)).set_duration(dur).set_start(t)
              clips_a.append(txt); t+=dur
          CompositeVideoClip(clips_a).set_duration(base.duration).write_videofile("/tmp/A-NATURAL-legendado.mp4", codec="libx264", audio_codec="aac", fps=30, threads=2)

          # B - DUBLADO TITULO 32px
          async def ga():
              await edge_tts.Communicate("¿Tu porcelanato suena hueco? El truco es el doble encolado.", "es-MX-JorgeNeural", rate="-8%").save("/tmp/audio_es.mp3")
          asyncio.run(ga())
          titulo = TextClip("¿TU PORCELANATO SUENA HUECO?", font="Montserrat-Bold", fontsize=32, color="#FFD800", stroke_color="black", stroke_width=3, method="caption", size=(950, None))
          titulo = titulo.set_position(("center", 180)).set_duration(base.duration)
          CompositeVideoClip([base, titulo]).set_duration(base.duration).write_videofile("/tmp/temp_b.mp4", codec="libx264", fps=30, audio=False, threads=2)
          subprocess.run(["ffmpeg","-y","-i","/tmp/temp_b.mp4","-i","/tmp/audio_es.mp3","-c:v","copy","-map","0:v:0","-map","1:a:0","-shortest","/tmp/B-DUBLADO-titulo.mp4"], check=True)
          print("OK")
          PY

      - name: Upload 3 videos teste A/B
        uses: actions/upload-artifact@v4
        with:
          name: teste-AB-natural
          path: |
            /tmp/video_final.mp4
            /tmp/A-NATURAL-legendado.mp4
            /tmp/B-DUBLADO-titulo.mp4
          if-no-files-found: warn
