      - name: 1 - Baixa VIDEO e ESCOLHE top
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          cat > /tmp/baixa.py << 'PY'
          import os, random, requests, json, time
          token=os.getenv("TELEGRAM_BOT_TOKEN").strip()
          hist_file="historico_4redes.json"
          try: hist=json.load(open(hist_file))
          except: hist=[]
          r=requests.get(f"https://api.telegram.org/bot{token}/getUpdates", params={"limit":100, "timeout":30}).json()
          file_ids=[]
          for upd in r.get("result",[]):
            msg=upd.get("channel_post") or upd.get("message") or {}
            v=msg.get("video")
            if v and v.get("file_id"): file_ids.append(v["file_id"])
          file_ids=list(dict.fromkeys(file_ids))
          print(f"Total file_ids encontrados: {len(file_ids)}")
          disp=[f for f in file_ids if f not in hist] or file_ids
          if len(disp)==len(file_ids) and len(hist)>0:
            hist=[]
            disp=file_ids
          random.shuffle(disp)
          escolhido=None
          for fid in disp[:15]:
            try:
              resp=requests.get(f"https://api.telegram.org/bot{token}/getFile", params={"file_id":fid}, timeout=20).json()
              print(f"Tentando {fid[:15]}... {resp}")
              if not resp.get("ok"):
                print(f"Pulando, erro: {resp}")
                continue
              fp=resp["result"]["file_path"]
              dl=f"https://api.telegram.org/file/bot{token}/{fp}"
              print(f"Baixando {dl[:80]}...")
              data=requests.get(dl, timeout=60).content
              if len(data)<10000:
                print("Arquivo muito pequeno, pulando")
                continue
              open("/tmp/original.mp4","wb").write(data)
              escolhido=fid
              print(f"OK BAIXADO {len(data)} bytes")
              break
            except Exception as e:
              print(f"Erro tentando {fid[:10]}: {e}")
              continue
          if not escolhido:
            print("NENHUM VIDEO VALIDO, usando ultimo do historico")
            # tenta pegar qualquer um do file_ids sem verificar historico
            escolhido=disp[0]
            raise SystemExit(f"FALHA: Nenhum file_id valido. Telegram retornou erro pra todos. Apague historico_4redes.json e tente denovo")
          hist.append(escolhido)
          json.dump(hist[-60:], open(hist_file,"w"))
          escolha=random.choice(["top1","top2","top3"])
          # pra garantir que video e transcricao batam, usa o mesmo top
          if len(disp)>=3:
            # se escolhemos dos ultimos, mantem escolha coerente
            pass
          open("escolha.txt","w").write(escolha)
          print(f"FINAL ESCOLHA {escolha} VIDEO {escolhido[:12]}")
          PY
          python /tmp/baixa.py
