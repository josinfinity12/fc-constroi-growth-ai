name: post_perpetuo
on:
  workflow_dispatch:
    inputs:
      modo_teste:
        description: 'Modo teste? (sim/nao)'
        required: true
        default: 'sim'
        type: choice
        options:
          - sim
          - nao
  schedule:
    - cron: '0 12,17,22 * * *'
jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-montserrat
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
          pip install Pillow edge-tts moviepy==1.0.3 --no-cache-dir
          mkdir -p /tmp
      - name: DUBLA RAPIDA COM ACENTOS 60px EXTRA BOLD
        env:
          IMAGEMAGICK_BINARY: /usr/bin/convert
        run: |
          python - << 'PY'
          import PIL.Image
          if not hasattr(PIL.Image, 'ANTIALIAS'): PIL.Image.ANTIALIAS = PIL.Image.LANCZOS
          import os, asyncio, subprocess, json, textwrap
          from moviepy.editor import VideoFileClip, TextClip, CompositeVideoClip
          import edge_tts

          base_path = "videos_brutos/top1.mp4"
          def to_916(c):
              c=c.resize(height=1920)
              return c.crop(width=1080,height=1920,x_center=c.w/2,y_center=c.h/2) if c.w>1080 else c.on_color(size=(1080,1920),color=(0,0,0),pos=('center','center'))

          base = to_916(VideoFileClip(base_path))
          video_dur = base.duration

          # COM ACENTOS - pronúncia perfeita
          texto_es = "¡Hola, equipo! Hoy les traigo el paso a paso de cómo se hizo este proyecto del gabinete. Muchos me preguntaron qué técnica se usó. Los productos que usé fueron sobras de piso de la misma obra. Usé varillas de hierro, las amarré bien. Después hice un concreto bien fuerte. Usé masilla plástica para los bordes. Todo de piso. Corté las piezas al tamaño exacto. La clienta quería aprovechar el lavamanos que sigue en su lugar, no lo removí. Fui levantando el gabinete alrededor de él, solo desconecté el agua y el desagüe. Hice el montaje de acuerdo al espacio. No hubo material específico, simplemente piso, pegamento y varilla. ¡Vamos a escalar este perfil hasta la luna! Gracias, hasta la próxima."

          chunks = textwrap.wrap(texto_es, width=110, break_long_words=False)

          async def gerar():
              audios=[]
              for i, txt in enumerate(chunks):
                  p=f"/tmp/c{i}.mp3"
                  for t in range(3):
                      try:
                          # +18% MAIS RAPIDO - dinâmico
                          await edge_tts.Communicate(txt, "es-MX-JorgeNeural", rate="+18%", volume="+5%").save(p)
                          if os.path.getsize(p) > 1000:
                              audios.append(p)
                              break
                      except:
                          await asyncio.sleep(1)
                  await asyncio.sleep(0.6)
              with open("/tmp/lista.txt","w") as l:
                  for a in audios: l.write(f"file '{a}'\n")
              subprocess.run(["ffmpeg","-y","-f","concat","-safe","0","-i","/tmp/lista.txt","-c","copy","/tmp/audio_raw.mp3"], check=True)

          asyncio.run(gerar())

          r=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","json","/tmp/audio_raw.mp3"], capture_output=True, text=True)
          audio_dur=float(json.loads(r.stdout)['format']['duration'])
          print(f"Audio rapido: {audio_dur}s Video: {video_dur}s")

          # SE AUDIO FOR MAIOR QUE VIDEO, ACELERA. SE FOR MENOR, MANTEM RAPIDO E CORTA VIDEO
          if audio_dur > video_dur:
              fator = audio_dur / video_dur
              fator = min(fator, 1.4) # max 1.4x mais rapido
              subprocess.run(["ffmpeg","-y","-i","/tmp/audio_raw.mp3","-filter:a",f"atempo={fator}","/tmp/audio_final.mp3"], check=True)
              final_dur = video_dur
          else:
              subprocess.run(["ffmpeg","-y","-i","/tmp/audio_raw.mp3","-c","copy","/tmp/audio_final.mp3"], check=True)
              final_dur = audio_dur

          # corta video pra durar igual audio rapido - fica sincronizado sem lentidão
          titulo = TextClip("GABINETE HECHO CON SOBRAS DE PISO", font="Montserrat-ExtraBold", fontsize=60, color="#FFD800", stroke_color="black", stroke_width=7, method="caption", size=(950,None))
          titulo = titulo.set_position(("center","center")).set_duration(final_dur)

          base_cut = base.subclip(0, final_dur)
          CompositeVideoClip([base_cut,titulo]).set_duration(final_dur).write_videofile("/tmp/temp_b.mp4",codec="libx264",fps=30,audio=False,threads=2)
          subprocess.run(["ffmpeg","-y","-i","/tmp/temp_b.mp4","-i","/tmp/audio_final.mp3","-c:v","copy","-map","0:v:0","-map","1:a:0","-shortest","/tmp/B-TOP1-RAPIDO-ACENTOS-60px.mp4"],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: top1-rapido-acentos
          path: /tmp/B-TOP1-RAPIDO-ACENTOS-60px.mp4
