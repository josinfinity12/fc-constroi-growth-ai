name: FC Construye - 4 Redes Perpetuo FINAL FIX

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instala deps
        run: |
          pip install "instagrapi[video]" requests google-api-python-client google-auth google-auth-oauthlib telethon edge-tts -q
          sudo apt-get update && sudo apt-get install -y ffmpeg -q

      - name: 1 - Baixa VIDEO HD sem limite 20MB
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_CHANNEL_BACKUP: ${{ secrets.TELEGRAM_CHANNEL_BACKUP }}
        run: |
          cat > /tmp/baixa.py << 'PY'
          import os, json, asyncio
          token=os.getenv("TELEGRAM_BOT_TOKEN","").strip()
          api_id_raw=os.getenv("TELEGRAM_API_ID","").strip().split(":")[0]
          api_hash=os.getenv("TELEGRAM_API_HASH","").strip()
          channel=(os.getenv("TELEGRAM_CHANNEL") or os.getenv("TELEGRAM_CHANNEL_BACKUP") or "").strip()
          print(f"DEBUG ID={api_id_raw} len={len(api_id_raw)} HASH_len={len(api_hash)} CHANNEL={channel}")
          try:
            api_id=int(api_id_raw)
            if api_id>2147483647:
              raise ValueError(f"API_ID {api_id} muito grande! Você colocou o BOT_TOKEN. Use 32760054")
          except Exception as e:
            raise SystemExit(f"TELEGRAM_API_ID invalido: '{api_id_raw}' - tem que ser 32760054 - Erro: {e}")
          hist_file="historico_4redes.json"
          try: hist=json.load(open(hist_file))
          except: hist=[]
          async def main():
            from telethon import TelegramClient
            client=TelegramClient("/tmp/bot_session", api_id, api_hash)
            await client.start(bot_token=token)
            entity=await client.get_entity(channel)
            msgs=await client.get_messages(entity, limit=40)
            vids=[m for m in msgs if m.video]
            print(f"HD tem {len(vids)} videos | historico {len(hist)}")
            if not vids: raise SystemExit("HD VAZIO")
            disp=[v for v in vids if str(v.id) not in hist]
            if not disp:
              print("Reset historico"); disp=vids; hist.clear()
            import random; v=random.choice(disp)
            print(f"Baixando ID {v.id} size {v.video.size}")
            await client.download_media(v, "/tmp/original.mp4")
            print(f"Baixado {os.path.getsize('/tmp/original.mp4')} bytes")
            hist.append(str(v.id))
            json.dump(hist[-100:], open(hist_file,"w"))
            await client.disconnect()
          asyncio.run(main())
          open("escolha.txt","w").write("top1")
          PY
          python /tmp/baixa.py

      - name: 1.5 - DUBLAGEM ES com transcricoes
        run: |
          cat > /tmp/dubla.py << 'PY'
          import json, asyncio, os
          escolha="top1"
          try:
            dados=json.load(open("transcricoes.json", encoding="utf-8"))
            texto=dados.get(f"{escolha}_es") or dados.get(f"{escolha}") or dados.get("top1_es") or "HOLA AMIGOS!"
          except:
            texto="HOLA AMIGOS! Del 1 al 10 cuanto le dan a este trabajo?"
          texto=texto[:380]
          print(f"DUBLANDO: {texto[:120]}")
          async def dub():
            import edge_tts
            await edge_tts.Communicate(texto, "es-MX-JorgeNeural", rate="-8%", volume="+25%").save("/tmp/dub.mp3")
          asyncio.run(dub())
          os.system('ffmpeg -y -i /tmp/original.mp4 -i /tmp/dub.mp3 -filter_complex "[0:a]volume=0.12[bg];[1:a]volume=2.0[voice];[bg][voice]amix=inputs=2:duration=longest" -c:v copy -map 0:v -map 1:a -shortest /tmp/dublado.mp4 -loglevel error')
          if os.path.exists("/tmp/dublado.mp4") and os.path.getsize("/tmp/dublado.mp4")>10000:
            os.system("cp /tmp/dublado.mp4 /tmp/original.mp4")
            print("DUBLAGEM OK")
          open("/tmp/legenda.txt","w", encoding="utf-8").write(texto)
          PY
          python /tmp/dubla.py

      - name: 2 - Converte 9:16
        run: |
          ffmpeg -y -i /tmp/original.mp4 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -c:v libx264 -preset ultrafast -crf 23 -c:a aac -b:a 128k /tmp/processed_reel.mp4
          ffmpeg -y -i /tmp/processed_reel.mp4 -ss 0.5 -vframes 1 /tmp/thumb.jpg

      - name: 3 - POSTA INSTAGRAM
        env:
          INSTAGRAM_USER: ${{ secrets.INSTAGRAM_USER }}
          INSTAGRAM_PASS: ${{ secrets.INSTAGRAM_PASS }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        continue-on-error: true
        run: |
          cat > /tmp/ig.py << 'PY'
          import os
          from instagrapi import Client
          user=os.getenv("INSTAGRAM_USER"); pwd=os.getenv("INSTAGRAM_PASS"); sess=os.getenv("IG_SESSIONID")
          texto=open("/tmp/legenda.txt", encoding="utf-8").read()[:180]
          caption=f"{texto}\n\n¿Del 1 al 10? Comenta!\n.\n#construccion #albanil #obra #fcconstruye"
          cl=Client(); cl.delay_range=[1,3]
          try:
            if sess: cl.login_by_sessionid(sess.strip())
            else: cl.login(user,pwd)
            cl.clip_upload("/tmp/processed_reel.mp4", caption, thumbnail="/tmp/thumb.jpg")
            print("INSTAGRAM OK")
          except Exception as e:
            print(f"IG erro {e}")
            cl=Client(); cl.login(user,pwd); cl.clip_upload("/tmp/processed_reel.mp4", caption)
          PY
          python /tmp/ig.py

      - name: 4 - POSTA FACEBOOK FIX 400
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        continue-on-error: true
        run: |
          cat > /tmp/fb.py << 'PY'
          import os, requests, time
          page=os.getenv("FB_PAGE_ID").strip(); token=os.getenv("FB_PAGE_TOKEN").strip()
          legenda=open("/tmp/legenda.txt", encoding="utf-8").read()[:300]
          url=f"https://graph.facebook.com/v20.0/{page}/video_reels"
          r1=requests.post(url, data={"upload_phase":"start","access_token":token}).json()
          print(f"FB START {r1}")
          vid=r1["video_id"]; up_url=r1["upload_url"]
          size=os.path.getsize("/tmp/processed_reel.mp4")
          with open("/tmp/processed_reel.mp4","rb") as f:
            r2=requests.post(up_url, headers={"Authorization":f"OAuth {token}","file_offset":"0","file_size":str(size)}, data=f)
          print(f"FB UP {r2.status_code}")
          time.sleep(7)
          r3=requests.post(url, data={"upload_phase":"finish","video_id":vid,"description":legenda,"access_token":token})
          print(f"FB FINISH {r3.text[:1000]}")
          PY
          python /tmp/fb.py

      - name: 5 - POSTA YOUTUBE SHORTS
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        continue-on-error: true
        run: |
          cat > /tmp/yt.py << 'PY'
          import os, requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          cid=os.getenv("YT_CLIENT_ID").strip(); csec=os.getenv("YT_CLIENT_SECRET").strip(); rtok=os.getenv("YT_REFRESH_TOKEN").strip()
          resp=requests.post("https://oauth2.googleapis.com/token", data={"client_id":cid,"client_secret":csec,"refresh_token":rtok,"grant_type":"refresh_token"}).json()
          creds=Credentials(token=resp["access_token"], refresh_token=rtok, client_id=cid, client_secret=csec, token_uri="https://oauth2.googleapis.com/token")
          youtube=build("youtube","v3",credentials=creds)
          legenda=open("/tmp/legenda.txt", encoding="utf-8").read()
          body={"snippet":{"title":legenda[:85]+" #shorts","description":legenda+"\n#construccion #shorts","categoryId":"27"},"status":{"privacyStatus":"public"}}
          media=MediaFileUpload("/tmp/processed_reel.mp4", mimetype="video/mp4", resumable=True)
          result=youtube.videos().insert(part="snippet,status", body=body, media_body=media).execute()
          print(f"YOUTUBE OK {result['id']}")
          PY
          python /tmp/yt.py

      - name: 6 - POSTA TIKTOK
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        continue-on-error: true
        run: |
          cat > /tmp/tt.py << 'PY'
          import os, requests
          token=os.getenv("TIKTOK_ACCESS_TOKEN").strip()
          legenda=open("/tmp/legenda.txt", encoding="utf-8").read()[:150]
          headers={"Authorization":f"Bearer {token}","Content-Type":"application/json; charset=UTF-8"}
          body={"post_info":{"title":f"{legenda} #construccion","privacy_level":"PUBLIC_TO_EVERYONE"},"source_info":{"source":"FILE_UPLOAD","video_size":os.path.getsize("/tmp/processed_reel.mp4"),"chunk_size":10000000,"total_chunk_count":1}}
          r=requests.post("https://open.tiktokapis.com/v2/post/publish/video/init/", headers=headers, json=body)
          print(r.text[:1000])
          if "upload_url" in r.text:
            up=r.json()["data"]["upload_url"]; size=os.path.getsize("/tmp/processed_reel.mp4")
            with open("/tmp/processed_reel.mp4","rb") as f: requests.put(up, headers={"Content-Range":f"bytes 0-{size-1}/{size}"}, data=f)
          PY
          python /tmp/tt.py

      - name: 7 - Salva historico
        run: |
          git config user.name "fc-bot"
          git config user.email "bot@fcconstruye.com"
          git add historico_4redes.json || true
          git commit -m "post $(date)" || true
          git push || true
