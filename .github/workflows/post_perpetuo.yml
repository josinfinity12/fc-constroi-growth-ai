name: post_perpetuo_multidestino

on:
  schedule:
    - cron: '0 12,17,22 * * *'
  workflow_dispatch:

jobs:
  post_tudo:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Instala tudo
        run: |
          pip install yt-dlp moviepy openai whisper browser-cookie3 -q
          sudo apt-get update && sudo apt-get install -y ffmpeg -qq

      - name: 1. PUXA do @fc_constroi (FONTE) - FIX DEFINITIVO
        env:
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          echo "$IG_COOKIES" > /tmp/cookies.txt
          mkdir -p /tmp/insta
          # Pega o ultimo reel do perfil usando yt-dlp que aceita cookies.txt
          yt-dlp --cookies /tmp/cookies.txt -o "/tmp/insta/%(id)s.%(ext)s" --no-playlist --max-downloads 1 "https://www.instagram.com/fc_constroi/reels/" || \
          yt-dlp --cookies /tmp/cookies.txt -o "/tmp/insta/%(id)s.%(ext)s" --no-playlist --max-downloads 1 "https://www.instagram.com/fc_constroi/"
          ls -lh /tmp/insta/
          VIDEO=$(find /tmp/insta -type f | head -n 1)
          echo "VIDEO_PATH=$VIDEO"
          cp "$VIDEO" /tmp/original.mp4
          echo "VIDEO_PATH=/tmp/original.mp4" >> $GITHUB_ENV

      - name: 2. Dublagem + Legenda Poppins Amarela
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/dublagem_legenda.py --input /tmp/original.mp4 --output /tmp/processed_reel.mp4

      - name: 3. POSTA @fc_construye (IG DESTINO)
        env:
          IG_COOKIES_CONSTRUYE: ${{ secrets.IG_COOKIES_CONSTRUYE }}
        run: |
          echo "$IG_COOKIES_CONSTRUYE" > /tmp/cookies_construye.txt
          python scripts/post_ig.py --cookies /tmp/cookies_construye.txt --video /tmp/processed_reel.mp4

      - name: 4. POSTA YouTube Shorts
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python scripts/post_yt.py --video /tmp/processed_reel.mp4

      - name: 5. POSTA TikTok + Facebook
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: |
          python scripts/post_tiktok_fb.py --video /tmp/processed_reel.mp4

      - name: 6. KWAI - PENDENTE
        run: echo "Kwai pendente"
