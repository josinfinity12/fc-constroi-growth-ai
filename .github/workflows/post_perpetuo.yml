name: post_perpetuo LATAM HD

on:
  schedule:
    - cron: '0 17 * * *'
    - cron: '0 20 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup - FIX MOVIEPY
        run: |
          pip install "instagrapi[video]" requests
          pip install --no-deps "moviepy==2.2.1"
          pip install imageio imageio-ffmpeg
          sudo apt-get install -y ffmpeg

      - name: 1. Baixa VIDEO do Telegram HD - SEUS 5 VIDEOS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_BACKUP }}
        run: |
          cat > /tmp/baixa.py << 'PY'
          import os, random, requests, sys
          token = os.getenv("TELEGRAM_BOT_TOKEN").strip()
          channel = os.getenv("TELEGRAM_CHANNEL").strip()
          print(f"BOT {token[:6]}... CANAL {channel} - HD com 5 videos")
          url = f"https://api.telegram.org/bot{token}/getUpdates"
          r = requests.get(url, params={"limit": 100}).json()
          file_ids = []
          for upd in r.get("result", []):
              post = upd.get("channel_post") or upd.get("message") or {}
              if "video" in post:
                  file_ids.append(post["video"]["file_id"])
          print(f"Videos no HD: {len(file_ids)}")
          if not file_ids:
              sys.exit(1)
          fid = random.choice(file_ids[-15:])
          fp = requests.get(f"https://api.telegram.org/bot{token}/getFile", params={"file_id": fid}).json()["result"]["file_path"]
          dl = f"https://api.telegram.org/file/bot{token}/{fp}"
          with open("/tmp/original.mp4", "wb") as f:
              f.write(requests.get(dl).content)
          escolha = random.choice(["top1", "top2", "top3"])
          open("escolha.txt", "w").write(escolha)
          print(f"BAIXADO {escolha}")
          PY
          python /tmp/baixa.py

      - name: 2. Prepara Reels 9:16
        run: |
          ffmpeg -y -i /tmp/original.mp4 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -c:v libx264 -preset ultrafast -c:a aac /tmp/processed_reel.mp4
          # Cria thumbnail manualmente pra não depender do moviepy falhar
          ffmpeg -y -i /tmp/processed_reel.mp4 -ss 1 -vframes 1 /tmp/thumb.jpg
          ls -lh /tmp/processed_reel.mp4 /tmp/thumb.jpg

      - name: 3. POSTA @fc_construye LATAM - FIX
        env:
          INSTAGRAM_USER: ${{ secrets.INSTAGRAM_USER }}
          INSTAGRAM_PASS: ${{ secrets.INSTAGRAM_PASS }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: |
          cat > /tmp/postar.py << 'PY'
          import json, os
          from instagrapi import Client
          user = os.getenv("INSTAGRAM_USER")
          pwd = os.getenv("INSTAGRAM_PASS")
          escolha = open("escolha.txt").read().strip()
          dados = json.load(open("transcricoes.json"))
          texto_es = dados[f"{escolha}_es"]
          if not texto_es.upper().startswith("HOLA AMIGOS"):
              texto_es = "HOLA AMIGOS! " + texto_es
          caption = f"{texto_es[:280]}\n\n¿Lo harías en tu casa? Deja tu nota 1 al 10 👇\n\n#construccion #fcconstruye"
          cl = Client()
          sess = os.getenv("IG_SESSIONID")
          try:
              if sess:
                  cl.login_by_sessionid(sess)
              else:
                  cl.login(user, pwd)
          except:
              cl.login(user, pwd)
          # Agora passa thumbnail que criamos, não deixa o moviepy quebrar
          cl.clip_upload("/tmp/processed_reel.mp4", caption, thumbnail="/tmp/thumb.jpg")
          print("POSTADO LATAM HD OK - FIX MOVIEPY FUNCIONOU")
          PY
          python /tmp/postar.py
