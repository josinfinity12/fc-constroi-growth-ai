name: Postar no Kwai
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *' # todo dia 11h da manhã Brasil

jobs:
  post-kwai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright && playwright install chromium
      - run: python kwai_uploader.py
        env:
          KWAI_COOKIES: ${{ secrets.KWAI_COOKIES }}
