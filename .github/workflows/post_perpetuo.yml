name: post_perpetuo
on:
  workflow_dispatch:
    inputs:
      modo_teste:
        description: 'Modo teste? (sim/nao)'
        required: true
        default: 'sim'
        type: choice
        options:
          - sim
          - nao
  schedule:
    - cron: '0 12,17,22 * * *'
jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-montserrat
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
          pip install Pillow edge-tts moviepy==1.0.3 --no-cache-dir
          mkdir -p /tmp
      - name: DUBLA SYNC 100% FIX ANTI NO AUDIO 60px EXTRA BOLD
        env:
          IMAGEMAGICK_BINARY: /usr/bin/convert
        run: |
          python - << 'PY'
          import PIL.Image
          if not hasattr(PIL.Image, 'ANTIALIAS'): PIL.Image.ANTIALIAS = PIL.Image.LANCZOS
          import os, asyncio, subprocess, re, json, time, textwrap
          from moviepy.editor import VideoFileClip, TextClip, CompositeVideoClip
          import edge_tts

          base_path = "videos_brutos/top1.mp4"
          def to_916(c):
              c=c.resize(height=1920)
              return c.crop(width=1080,height=1920,x_center=c.w/2,y_center=c.h/2) if c.w>1080 else c.on_color(size=(1080,1920),color=(0,0,0),pos=('center','center'))

          base = to_916(VideoFileClip(base_path))
          video_dur = base.duration
          print(f"VIDEO: {video_dur}")

          texto_es = "Hola equipo! Hoy les traigo el paso a paso de como se hizo este proyecto del gabinete. Muchos me preguntaron que tecnica se uso. Los productos que use fueron sobras de piso de la misma obra. Use varillas de hierro, las amarre bien. Despues hice un concreto bien fuerte. Use masilla plastica para los bordes. Todo de piso. Corte las piezas al tamano exacto. La clienta queria aprovechar el lavamanos que sigue en su lugar, no lo removi. Fui levantando el gabinete alrededor de el, solo desconecte el agua y el desague. Hice el montaje de acuerdo al espacio. No hubo material especifico, simplemente piso, pegamento y varilla. Vamos a escalar este perfil hasta la luna! Gracias, hasta la proxima."

          # QUEBRA EM 120 CARACTERES MAX - ANTI NO AUDIO
          chunks = textwrap.wrap(texto_es, width=120, break_long_words=False)
          print(f"CHUNKS: {len(chunks)}")

          async def gerar():
              audios=[]
              for i, txt in enumerate(chunks):
                  txt = txt.strip()
                  if not txt: continue
                  p = f"/tmp/c{i}.mp3"
                  for tentativa in range(3):
                      try:
                          # sem rate pra nao dar erro, voz mais estavel
                          await edge_tts.Communicate(txt, "es-MX-JorgeNeural").save(p)
                          # verifica se gerou
                          if os.path.getsize(p) > 1000:
                              audios.append(p)
                              print(f"OK {i}: {txt[:30]}")
                              break
                      except Exception as e:
                          print(f"Tentativa {tentativa} falhou {i}: {e}")
                          await asyncio.sleep(1 + tentativa)
                  await asyncio.sleep(0.8)  # delay anti rate limit
              # concat
              with open("/tmp/lista.txt","w") as l:
                  for a in audios: l.write(f"file '{a}'\n")
              subprocess.run(["ffmpeg","-y","-f","concat","-safe","0","-i","/tmp/lista.txt","-c","copy","/tmp/audio_raw.mp3"], check=True)

          asyncio.run(gerar())

          # pega duração e sincroniza 100%
          r=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","json","/tmp/audio_raw.mp3"], capture_output=True, text=True)
          audio_dur=float(json.loads(r.stdout)['format']['duration'])
          fator = max(0.5, min(audio_dur / video_dur, 1.8))
          print(f"SYNC fator {fator} audio {audio_dur} -> video {video_dur}")
          subprocess.run(["ffmpeg","-y","-i","/tmp/audio_raw.mp3","-filter:a",f"atempo={fator}","/tmp/audio_sync.mp3"], check=True)

          titulo = TextClip("GABINETE HECHO CON SOBRAS DE PISO", font="Montserrat-ExtraBold", fontsize=60, color="#FFD800", stroke_color="black", stroke_width=7, method="caption", size=(950,None))
          titulo = titulo.set_position(("center","center")).set_duration(video_dur)

          CompositeVideoClip([base,titulo]).set_duration(video_dur).write_videofile("/tmp/temp_b.mp4",codec="libx264",fps=30,audio=False,threads=2)
          subprocess.run(["ffmpeg","-y","-i","/tmp/temp_b.mp4","-i","/tmp/audio_sync.mp3","-c:v","copy","-map","0:v:0","-map","1:a:0","-shortest","/tmp/B-TOP1-SYNC-FINAL-60px.mp4"],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: top1-sync-final
          path: /tmp/B-TOP1-SYNC-FINAL-60px.mp4
