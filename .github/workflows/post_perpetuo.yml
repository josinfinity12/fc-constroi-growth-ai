name: post_perpetuo
on: workflow_dispatch
jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests instaloader -q
      - name: Post sem travar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          python - << 'PY'
          import os, requests, subprocess
          SUPA_URL=os.getenv("SUPABASE_URL")
          SUPA_KEY=os.getenv("SUPABASE_KEY")
          PAGE_ID=os.getenv("PAGE_ID")
          PAGE_TOKEN=os.getenv("PAGE_TOKEN")
          headers={"apikey": SUPA_KEY, "Authorization": f"Bearer {SUPA_KEY}"}
          r=requests.get(f"{SUPA_URL}/rest/v1/instagram_reels_reais?select=*&order=score.desc&limit=1", headers=headers, timeout=20)
          reel=r.json()[0]
          insta_url=reel.get('url')
          titulo=reel.get('titulo','Armario 88k')
          print(f"URL: {insta_url}")
          shortcode=insta_url.split("/p/")[1].split("/")[0] if "/p/" in insta_url else insta_url.split("/reel/")[1].split("/")[0]
          print(f"Shortcode: {shortcode}")
          cmd=["instaloader","--","-","--no-captions","--no-metadata-json","--no-compress-json","--dirname-pattern=/tmp","--filename-pattern=video","--","--",f"-{shortcode}"]
          # Baixa com instaloader público sem login
          try:
              subprocess.run(["instaloader","--no-captions","--dirname-pattern=/tmp","--filename-pattern=video", f"-- -{shortcode}"], capture_output=True, text=True, timeout=30)
          except Exception as e:
              print(e)
          import glob
          files=glob.glob("/tmp/*.mp4")+glob.glob("/tmp/video/*.mp4")+glob.glob("*.mp4")
          print(f"Arquivos: {files}")
          PY
