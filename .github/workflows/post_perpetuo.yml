name: FC Post Perpetuo 5 Redes ES
on:
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install moviepy==1.0.3 gTTS yt-dlp requests
      - run: sudo apt-get install -y ffmpeg
      - run: python auto_post_perpetuo.py
      - uses: actions/upload-artifact@v4
        with:
          name: videos-finais-es
          path: videos_es_final/
          
