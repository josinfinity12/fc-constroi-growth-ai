name: FC - FONTE - MATCH INTELIGENTE + VELOZ PERPETUO

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  postar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instala deps
        run: |
          pip install "instagrapi[video]" requests google-api-python-client google-auth google-auth-oauthlib telethon edge-tts openai-whisper torch -q
          sudo apt-get update && sudo apt-get install -y ffmpeg -q

      - name: 1 - Baixa FC-FONTE via get_messages IDS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          cat > /tmp/baixa.py << 'PY'
          import os, json, asyncio
          token=os.getenv("TELEGRAM_BOT_TOKEN").strip()
          api_id=int(os.getenv("TELEGRAM_API_ID").strip().split(":")[0])
          api_hash=os.getenv("TELEGRAM_API_HASH").strip()
          ch_id=int(os.getenv("TELEGRAM_CHANNEL").strip())
          hist_file="historico_4redes.json"
          try: hist=json.load(open(hist_file))
          except: hist=[]
          async def main():
            from telethon import TelegramClient
            client=TelegramClient("/tmp/bot_session", api_id, api_hash)
            await client.start(bot_token=token)
            entity=await client.get_entity(ch_id)
            print(f"CANAL OK: {entity.title}")
            vids=[]
            for batch_start in range(1, 3000, 100):
              ids=list(range(batch_start, batch_start+100))
              try:
                msgs=await client.get_messages(entity, ids=ids)
                for m in msgs:
                  if m and m.video: vids.append(m)
              except: pass
              if len(vids)>=60: break
            print(f"Videos encontrados: {len(vids)}")
            disp=[v for v in vids if str(v.id) not in hist]
            if not disp: disp=vids; hist.clear()
            import random; v=random.choice(disp)
            await client.download_media(v, "/tmp/original.mp4")
            hist.append(str(v.id))
            json.dump(hist[-100:], open(hist_file,"w"))
            print(f"Baixado video ID {v.id}")
            await client.disconnect()
          asyncio.run(main())
          PY
          python /tmp/baixa.py

      - name: 1.5 - MATCH INTELIGENTE FIX + VELOZ 1.25x + LEGENDA AMARELA
        run: |
          cat > /tmp/dubla.py << 'PY'
          import json, asyncio, os, subprocess, re
          from pathlib import Path

          def get_duration(p):
              r=subprocess.check_output(f'ffprobe -v error -show_entries format=duration -of json "{p}"', shell=True)
              return float(json.loads(r)['format']['duration'])

          def atempo_filter(factor):
              filters=[]
              while factor > 2.0:
                  filters.append("atempo=2.0")
                  factor/=2.0
              while factor < 0.5:
                  filters.append("atempo=0.5")
                  factor/=0.5
              filters.append(f"atempo={factor:.4f}")
              return ",".join(filters)

          VELOCIDADE_VIDEO = 1.25

          try:
              import whisper
              model = whisper.load_model("tiny")
              result = model.transcribe("/tmp/original.mp4", language="pt", fp16=False)
              texto_orig = result["text"].lower()
              print(f"TRANSCRITO PT: {texto_orig}")
          except Exception as e:
              print(f"Whisper erro {e}")
              texto_orig = ""

          try:
              raw = open("transcricoes.json", encoding="utf-8").read()
              raw = re.sub(r',\s*}', '}', raw)
              raw = re.sub(r',\s*]', ']', raw)
              j = json.loads(raw)
          except Exception as e:
              print(f"ERRO JSON: {e}")
              j = {
                "top7_es": "Te enganaron con el MDF? Se hincha con la humedad.",
                "top8_es": "Deja de gastar dinero con muebles que se inflan y se llenan de moho. Este closet es para toda la vida, inmune a cupim, termitas y fuego.",
                "top6_es": ""
              }

          texto_es = ""; chave = ""

          if any(k in texto_orig for k in ["guardar roupa", "guarda roupa", "guarda-roupa", "closet", "ropero", "cupim", "cupins", "termita", "inmune", "imune", "fogo", "moho", "inflan"]):
              chave="top8_es"; texto_es=j.get("top8_es","")
              print("MATCH -> TOP8 CLOSET")
          elif any(k in texto_orig for k in ["mdf", "cocina mdf", "gabinete mdf", "cozinha mdf", "melamina"]):
              chave="top7_es"; texto_es=j.get("top7_es","")
              print("MATCH -> TOP7 MDF COZINHA")
          elif any(k in texto_orig for k in ["fachada", "muro", "trilliza", "tijolo baiano", "arandela"]):
              chave="top4_es"; texto_es=j.get("top4_es","")
          elif any(k in texto_orig for k in ["gaveta", "aluminio", "cantoneira", "pu 40"]):
              chave="top5_es"; texto_es=j.get("top5_es","")
          elif "cozinha" in texto_orig or "cocina" in texto_orig:
              chave="top2_es"; texto_es=j.get("top2_es","")
          elif "gabinete" in texto_orig or "lavabo" in texto_orig:
              chave="top1_es"; texto_es=j.get("top1_es","")

          if not texto_es:
              todas=[(k,v) for k,v in j.items() if k.endswith("_es") and len(v)>30]; todas.sort()
              try: hist=json.load(open("historico_4redes.json"))
              except: hist=[]
              idx=len(hist)%len(todas) if todas else 0
              chave, texto_es = todas[idx]
              print(f"FALLBACK: {chave}")

          print(f"ESCOLHIDO FINAL: {chave}")

          def cria_ass_amarela(texto, dur_total):
              # Cria ASS amarelo que NUNCA falha no ffmpeg
              palavras = texto.split()
              eventos = ""
              t=0
              for i in range(0, len(palavras), 7):
                  chunk = " ".join(palavras[i:i+7]).replace(",", "").replace(":", "")
                  ini = f"0:00:{t//60:02d}:{t%60:02d}.00"
                  fim = f"0:00:{(t+2)//60:02d}:{(t+2)%60:02d}.00"
                  eventos += f"Dialogue: 0,{ini},{fim},Default,,0,0,0,,{chunk}\n"
                  t+=2
              ass = f"""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,Arial,28,&H0000FFFF,&H0000FFFF,&H00000000,&H80000000,1,0,0,0,100,100,0,0,1,4,1,2,10,10,80,1
          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          {eventos}
          """
              Path("/tmp/legenda.ass").write_text(ass, encoding="utf-8")
              Path("/tmp/legenda.srt").write_text(texto, encoding="utf-8")

          if chave == "top6_es" or not texto_es.strip():
              print("TOP6 SEM NARRACAO")
              dur_orig=get_duration("/tmp/original.mp4")
              dur_veloz=dur_orig/VELOCIDADE_VIDEO
              os.system(f'ffmpeg -y -i /tmp/original.mp4 -filter_complex "[0:v]setpts={1/VELOCIDADE_VIDEO}*PTS,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920[v];[0:a]atempo={VELOCIDADE_VIDEO}[a]" -map "[v]" -map "[a]" -t {dur_veloz} -c:v libx264 -preset fast -crf 28 -c:a aac -b:a 96k /tmp/processed_reel.mp4 -loglevel error')
              open("/tmp/legenda.txt","w", encoding="utf-8").write("Mueble eterno de porcelanato #construccion")
          else:
              async def dub():
                  import edge_tts
                  await edge_tts.Communicate(texto_es,"es-MX-JorgeNeural",rate="+15%",volume="+15%").save("/tmp/dub.mp3")
              asyncio.run(dub())
              open("/tmp/legenda.txt","w", encoding="utf-8").write(texto_es[:400])
              cria_ass_amarela(texto_es, 30)

              dur_orig=get_duration("/tmp/original.mp4"); dur_dub=get_duration("/tmp/dub.mp3")
              dur_veloz=dur_orig/VELOCIDADE_VIDEO; factor=max(0.5,min(2.0,dur_dub/dur_veloz))
              atempo = atempo_filter(factor)

              # ETAPA 1 - Video dublado SEM legenda (garante que existe)
              cmd1=f'ffmpeg -y -i /tmp/original.mp4 -i /tmp/dub.mp3 -filter_complex "[0:v]setpts={1/VELOCIDADE_VIDEO}*PTS,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920[v];[0:a]atempo={VELOCIDADE_VIDEO},volume=0[bg];[1:a]{atempo},volume=2.0[voice];[bg][voice]amix=inputs=2:duration=first" -map "[v]" -map "[voice]" -t {dur_veloz} -c:v libx264 -preset fast -crf 28 -c:a aac -b:a 96k /tmp/temp_no_sub.mp4 -loglevel error'
              os.system(cmd1)
              print(f"ETAPA1 OK? {os.path.exists('/tmp/temp_no_sub.mp4')}")

              # ETAPA 2 - Queima legenda amarela ASS
              cmd2='ffmpeg -y -i /tmp/temp_no_sub.mp4 -vf "ass=/tmp/legenda.ass" -c:a copy -c:v libx264 -preset fast -crf 28 /tmp/processed_reel.mp4 -loglevel error'
              ret=os.system(cmd2)
              print(f"ETAPA2 RET {ret} EXISTE? {os.path.exists('/tmp/processed_reel.mp4')}")
              if not os.path.exists('/tmp/processed_reel.mp4'):
                  # Fallback total sem legenda
                  os.system('cp /tmp/temp_no_sub.mp4 /tmp/processed_reel.mp4')
                  print("Usou fallback sem legenda amarela")

          subprocess.run(f'ffmpeg -y -i /tmp/processed_reel.mp4 -ss 0.5 -vframes 1 /tmp/thumb.jpg -loglevel error', shell=True)
          print(f"OK FINAL {os.path.getsize('/tmp/processed_reel.mp4')} bytes - {chave}")
          PY
          python /tmp/dubla.py

      - name: 2 - PREVIEW - Video pra Kwai manual
        uses: actions/upload-artifact@v4
        with:
          name: video-match-veloz-PRONTO-KWAI
          path: |
            /tmp/processed_reel.mp4
            /tmp/thumb.jpg
            /tmp/legenda.txt
            /tmp/legenda.ass

      - name: 3 - POSTA INSTAGRAM
        env:
          INSTAGRAM_USER: ${{ secrets.INSTAGRAM_USER }}
          INSTAGRAM_PASS: ${{ secrets.INSTAGRAM_PASS }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        continue-on-error: true
        run: |
          cat > /tmp/ig.py << 'PY'
          import os; from instagrapi import Client
          texto=open("/tmp/legenda.txt", encoding="utf-8").read()[:180]
          caption=f"{texto}\n\n¿Del 1 al 10? 👇\n#construccion #fcconstruye"
          cl=Client(); cl.delay_range=[1,3]
          try:
            sid=os.getenv("IG_SESSIONID","").strip()
            if sid: cl.login_by_sessionid(sid)
            else: cl.login(os.getenv("INSTAGRAM_USER"), os.getenv("INSTAGRAM_PASS"))
          except: cl.login(os.getenv("INSTAGRAM_USER"), os.getenv("INSTAGRAM_PASS"))
          cl.clip_upload("/tmp/processed_reel.mp4", caption, thumbnail="/tmp/thumb.jpg")
          print("IG OK")
          PY
          python /tmp/ig.py

      - name: 4 - POSTA FACEBOOK
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        continue-on-error: true
        run: |
          cat > /tmp/fb.py << 'PY'
          import os, requests
          page=os.getenv("FB_PAGE_ID").strip(); token=os.getenv("FB_PAGE_TOKEN").strip()
          legenda=open("/tmp/legenda.txt", encoding="utf-8").read()[:300]
          url=f"https://graph-video.facebook.com/v20.0/{page}/videos"
          with open("/tmp/processed_reel.mp4","rb") as f:
              r=requests.post(url, data={"description": legenda,"access_token": token}, files={"source": f}, timeout=300)
              print(f"FB {r.status_code} {r.text[:500]}")
          PY
          python /tmp/fb.py

      - name: 5 - POSTA YOUTUBE SHORTS
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        continue-on-error: true
        run: |
          cat > /tmp/yt.py << 'PY'
          import os, requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          cid=os.getenv("YT_CLIENT_ID").strip(); csec=os.getenv("YT_CLIENT_SECRET").strip(); rtok=os.getenv("YT_REFRESH_TOKEN").strip()
          resp=requests.post("https://oauth2.googleapis.com/token", data={"client_id":cid,"client_secret":csec,"refresh_token":rtok,"grant_type":"refresh_token"}).json()
          creds=Credentials(token=resp["access_token"], refresh_token=rtok, client_id=cid, client_secret=csec, token_uri="https://oauth2.googleapis.com/token")
          youtube=build("youtube","v3",credentials=creds)
          legenda=open("/tmp/legenda.txt", encoding="utf-8").read()
          body={"snippet":{"title":legenda[:85]+" #shorts","description":legenda+"\n#construccion #shorts","categoryId":"27"},"status":{"privacyStatus":"public"}}
          youtube.videos().insert(part="snippet,status", body=body, media_body=MediaFileUpload("/tmp/processed_reel.mp4", mimetype="video/mp4", resumable=True)).execute()
          print("YT OK")
          PY
          python /tmp/yt.py

      - name: 6 - Salva historico
        run: |
          git config user.name "fc-bot"
          git config user.email "bot@fcconstruye.com"
          git add historico_4redes.json || true
          git commit -m "post 3 redes + kwai manual com legenda amarela $(date -u)" || true
          git push || true
