name: FC Post Perpetuo 5 Redes ES

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,16,21 * * *' # 3x por dia

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install moviepy==1.0.3 gTTS yt-dlp requests Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-7/policy.xml || true
          
      - name: Run auto post
        env:
          IMAGEMAGICK_BINARY: /usr/bin/convert
        run: |
          python auto_post_perpetuo.py
          
      - name: Save progress
        if: always()
        run: |
          git config --global user.email "bot@fcconstroi.com"
          git config --global user.name "FC BOT"
          git add log_postagens.json videos-finais-es/ || true
          git commit -m "update log" || true
          git push || true
          
      - uses: actions/upload-artifact@v4
        if: always()
        
        with:
          name: videos-finais-es
          path: videos-finais-es/
