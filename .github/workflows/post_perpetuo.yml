name: post_perpetuo
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post 100% @fc_constroi BR -> @fcconstruye ES 5 redes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          pip install requests yt-dlp -q
          python - << 'PY'
          import os, requests, subprocess, time
          SUPA_URL = os.getenv("SUPABASE_URL")
          SUPA_KEY = os.getenv("SUPABASE_KEY")
          PAGE_ID = os.getenv("PAGE_ID")
          PAGE_TOKEN = os.getenv("PAGE_TOKEN")
          COOKIES = os.getenv("IG_COOKIES")
          open('/tmp/cookies.txt','w').write(COOKIES or "")
          print("Cookie salvo")
          headers = {"apikey": SUPA_KEY, "Authorization": f"Bearer {SUPA_KEY}"}
          r = requests.get(f"{SUPA_URL}/rest/v1/instagram_reels_reais?select=*&order=score.desc&limit=1", headers=headers, timeout=20)
          reel = r.json()[0]
          insta_url = reel.get('url')
          titulo = reel.get('titulo','')
          print(f"URL: {insta_url}")
          # BAIXA O ARQUIVO em vez de pegar link
          cmd = ["yt-dlp", "--cookies", "/tmp/cookies.txt", "-o", "/tmp/video.mp4", "--no-playlist", insta_url]
          print("Baixando video...")
          result = subprocess.run(cmd, capture_output=True, text=True, timeout=120)
          print(result.stdout[-500:])
          print(result.stderr[-500:])
          if os.path.exists("/tmp/video.mp4"):
              size = os.path.getsize("/tmp/video.mp4")
              print(f"Video baixado: {size} bytes")
              # Envia arquivo direto pro Facebook, nao via URL
              with open("/tmp/video.mp4","rb") as f:
                  fb = requests.post(f"https://graph.facebook.com/v20.0/{PAGE_ID}/videos", data={"description": titulo, "access_token": PAGE_TOKEN}, files={"source": f}, timeout=300)
              print(f"FACEBOOK: {fb.status_code} {fb.text[:1000]}")
              if fb.status_code==200:
                  print("✅ POSTOU 100% @fcconstruye !!!")
          else:
              print("❌ Falha ao baixar, yt-dlp bloqueado")
          PY
