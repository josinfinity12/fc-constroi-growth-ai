name: post_perpetuo_es_5_plataformas

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Limpa erro fc-constroi-growth-ai
        run: |
          rm -f .gitmodules
          git rm --cached fc-constroi-growth-ai 2>/dev/null || true
          rm -rf fc-constroi-growth-ai 2>/dev/null || true
          rm -rf .git/modules/fc-constroi-growth-ai 2>/dev/null || true

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instala dependencias
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Cria arquivos se não existem
        run: |
          [ -f log_postagens.json ] || echo '{"videos_es":[],"ultimo_post":"","total_posts":0}' > log_postagens.json
          mkdir -p videos_es_final

      - name: Roda bot Francis Construye - 5 plataformas ES
        env:
          PAGE_ID: '61595702674802'
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          APP_ID: '1932783614771356'
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          python auto_post_perpetuo.py || python bot_perpetuo.py || python main.py

      - name: Salva progresso automatico
        run: |
          git config user.email "bot@fcconstruye.com"
          
          git config user.name "Bot Francis Construye ES"
          git add -A
          git add -f log_postagens.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "post es $(date -u)" && git push)
