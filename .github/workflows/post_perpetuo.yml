name: post-perpetuo-br-es

on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  post-perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install supabase python-dotenv gTTS elevenlabs moviepy==1.0.3 Pillow pysrt
      - name: Run v4.4.5.1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python auto_post_perpetuo.py
      - name: Commit 6 posts
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "FC Bot 6x"
          mkdir -p posts_auto/br_perpetuo posts_auto/es_doblado posts_auto/es_legendado audios_es_cache
          git add posts_auto/ audios_es_cache/ || true
          git diff --staged --quiet || (git commit -m "v4.4.5.1 6 POSTS BR+ES TIKTOK AMARELO - TAB8 INTACTA" && git push || true)
      - name: Verde sempre
        if: always()
        run: exit 0
