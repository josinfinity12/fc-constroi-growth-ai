name: post_perpetuo LATAM HD

on:
  schedule:
    - cron: '0 17 * * *' # 11:00 MX / 13:00 CO / 15:00 AR
    - cron: '0 20 * * *' # 14:00 MX / 16:00 CO / 18:00 AR - PICO
    - cron: '0 1 * * *'  # 19:00 MX / 21:00 CO / 23:00 AR - OURO
  workflow_dispatch:

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          pip install openai instagrapi requests
          sudo apt-get install -y ffmpeg
      - name: 1. Baixa VIDEO do Telegram HD - VIA BOT 902411
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_BACKUP }}
        run: |
          cat > /tmp/baixa.py << 'PY'
          import os, random, requests, sys
          token = os.getenv("TELEGRAM_BOT_TOKEN").strip()
          channel = os.getenv("TELEGRAM_CHANNEL").strip()
          print(f"BOT: {token[:6]}... CANAL: {channel} - Usando HD com 5 videos")
          if not token or not channel:
              print("ERRO: Falta TELEGRAM_BOT_TOKEN ou TELEGRAM_CHANNEL_BACKUP nos Secrets")
              sys.exit(1)
          
          # Pega videos do canal FC-FONTE via BOT
          url = f"https://api.telegram.org/bot{token}/getUpdates"
          r = requests.get(url, params={"limit": 100})
          data = r.json()
          
          file_ids = []
          for upd in data.get("result", []):
              post = upd.get("channel_post") or upd.get("message") or {}
              if "video" in post:
                  file_ids.append(post["video"]["file_id"])
              if "document" in post and "video" in str(post["document"].get("mime_type","")):
                  file_ids.append(post["document"]["file_id"])
          
          print(f"Achados {len(file_ids)} videos no seu HD -1004272")
          if not file_ids:
              print("Bot ainda nao viu videos. Encaminha 1 video novo pro canal FC-FONTE e roda de novo.")
              sys.exit(1)
          
          file_id = random.choice(file_ids[-15:])
          print(f"Baixando file_id {file_id[:20]}...")
          gf = requests.get(f"https://api.telegram.org/bot{token}/getFile", params={"file_id": file_id}).json()
          file_path = gf["result"]["file_path"]
          dl_url = f"https://api.telegram.org/file/bot{token}/{file_path}"
          
          with open("/tmp/original.mp4","wb") as f:
              f.write(requests.get(dl_url).content)
          
          escolha = random.choice(["top1","top2","top3"])
          open("escolha.txt","w").write(escolha)
          print(f"Download OK - {os.path.getsize('/tmp/original.mp4')/1024/1024:.1f} MB - Legenda {escolha}")
          PY
          python /tmp/baixa.py
          ls -lh /tmp/original.mp4
      - name: 2. DUBLAGEM HOLA AMIGOS - MANUAL
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > /tmp/dublar.py << 'PY'
          import json, subprocess, os
          from openai import OpenAI
          client=OpenAI(api_key=os.getenv("OPENAI_API_KEY")); escolha=open("escolha.txt").read().strip(); dados=json.load(open("transcricoes.json")); texto_es=dados[f"{escolha}_es"]
          if not texto_es.upper().startswith("HOLA AMIGOS"): texto_es="HOLA AMIGOS! "+texto_es
          tts=client.audio.speech.create(model="tts-1", voice="onyx", input=texto_es); tts.stream_to_file("/tmp/voz_es.mp3")
          subprocess.run(["ffmpeg","-i","/tmp/original.mp4","-i","/tmp/voz_es.mp3","-map","0:v","-map","1:a","-shortest","-vf","scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920","-c:v","libx264","-preset","ultrafast","-c:a","aac","/tmp/processed_reel.mp4","-y"], check=True)
          PY
          python /tmp/dublar.py
      - name: 3. POSTA @fc_construye - LATAM ES
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME_ES }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD_ES }}
        run: |
          cat > /tmp/postar.py << 'PY'
          import json, os; from instagrapi import Client
          escolha=open("escolha.txt").read().strip(); dados=json.load(open("transcricoes.json")); texto_es=dados[f"{escolha}_es"]
          caption=f"{texto_es[:250]}...\n\n¿Lo harías en tu casa? Deja tu nota 1 al 10 👇\n\n#construccion #fcconstruye"
          cl=Client(); cl.login(os.getenv("IG_USERNAME"), os.getenv("IG_PASSWORD")); cl.clip_upload("/tmp/processed_reel.mp4", caption)
          print("Postado LATAM ES - HD Telegram OK")
          PY
          python /tmp/postar.py
