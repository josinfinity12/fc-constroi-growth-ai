name: FC - FONTE - VELOZ + DUBLADO TOTAL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instala deps
        run: |
          pip install "instagrapi[video]" requests google-api-python-client google-auth google-auth-oauthlib telethon edge-tts -q
          sudo apt-get update && sudo apt-get install -y ffmpeg -q

      - name: 1 - Baixa FC-FONTE via get_messages IDS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          cat > /tmp/baixa.py << 'PY'
          import os, json, asyncio
          token=os.getenv("TELEGRAM_BOT_TOKEN").strip()
          api_id=int(os.getenv("TELEGRAM_API_ID").strip().split(":")[0])
          api_hash=os.getenv("TELEGRAM_API_HASH").strip()
          ch_id=int(os.getenv("TELEGRAM_CHANNEL").strip())
          hist_file="historico_4redes.json"
          try: hist=json.load(open(hist_file))
          except: hist=[]
          async def main():
            from telethon import TelegramClient
            client=TelegramClient("/tmp/bot_session", api_id, api_hash)
            await client.start(bot_token=token)
            entity=await client.get_entity(ch_id)
            print(f"CANAL OK: {entity.title}")
            vids=[]
            for batch_start in range(1, 3000, 100):
              ids=list(range(batch_start, batch_start+100))
              try:
                msgs=await client.get_messages(entity, ids=ids)
                for m in msgs:
                  if m and m.video: vids.append(m)
              except: pass
              if len(vids)>=60: break
            print(f"Videos: {len(vids)}")
            disp=[v for v in vids if str(v.id) not in hist]
            if not disp: disp=vids; hist.clear()
            import random; v=random.choice(disp)
            await client.download_media(v, "/tmp/original.mp4")
            hist.append(str(v.id))
            json.dump(hist[-100:], open(hist_file,"w"))
            await client.disconnect()
          asyncio.run(main())
          PY
          python /tmp/baixa.py

      - name: 1.5 - VELOCIDADE + DUBLAGEM TOTAL AJUSTADA
        run: |
          cat > /tmp/dubla.py << 'PY'
          import json, asyncio, os, subprocess

          def get_duration(p):
              import json as js
              r=subprocess.check_output(f'ffprobe -v error -show_entries format=duration -of json "{p}"', shell=True)
              return float(js.loads(r)['format']['duration'])

          # CONFIG PERPETUA - MUDA AQUI A VELOCIDADE
          VELOCIDADE_VIDEO = 1.25  # 1.25 = 25% mais rapido, 1.4 = 40% mais rapido
          # Quanto maior, mais curto e viral

          try:
              j=json.load(open("transcricoes.json", encoding="utf-8"))
              texto=j.get("top1_es") or j.get("top1") or list(j.values())[0]
          except:
              texto="HOLA AMIGOS! Del 1 al 10 cuanto le dan a este trabajo? Comenta abajo."

          # Texto total, sem corte
          print(f"Transcricao total: {len(texto)} caracteres")
          
          async def dub():
              import edge_tts
              # rate +15% para falar mais rapido e acompanhar video veloz
              await edge_tts.Communicate(texto,"es-MX-JorgeNeural",rate="+20%",volume="+10%").save("/tmp/dub.mp3")
          asyncio.run(dub())

          dur_orig=get_duration("/tmp/original.mp4")
          dur_dub=get_duration("/tmp/dub.mp3")
          print(f"Original {dur_orig:.1f}s | Dub {dur_dub:.1f}s")

          # 1 - Acelera VIDEO
          dur_video_veloz = dur_orig / VELOCIDADE_VIDEO
          print(f"Video veloz {dur_video_veloz:.1f}s com {VELOCIDADE_VIDEO}x")

          # 2 - Ajusta DUB para durar exatamente o video veloz
          # atempo = dur_dub / dur_video_veloz
          factor = dur_dub / dur_video_veloz
          # limita atempo entre 0.5 e 2.0
          if factor < 0.5: factor = 0.5
          if factor > 2.0: factor = 2.0

          print(f"Fator ajuste dub: {factor:.2f}")

          # Comando final: video acelerado + dub ajustada + mix perpetuo
          cmd = f'''ffmpeg -y -i /tmp/original.mp4 -i /tmp/dub.mp3 -filter_complex \
          "[0:v]setpts={1/VELOCIDADE_VIDEO}*PTS,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920[v]; \
           [0:a]atempo={VELOCIDADE_VIDEO},volume=0.07[bg]; \
           [1:a]atempo={factor},volume=2.0[voice]; \
           [bg][voice]amix=inputs=2:duration=first:dropout_transition=0" \
          -map "[v]" -map 1:a -t {dur_video_veloz} -c:v libx264 -preset fast -crf 28 -c:a aac -b:a 96k /tmp/processed_reel.mp4 -loglevel error'''

          os.system(cmd)
          subprocess.run(f'ffmpeg -y -i /tmp/processed_reel.mp4 -ss 0.5 -vframes 1 /tmp/thumb.jpg -loglevel error', shell=True)
          
          open("/tmp/legenda.txt","w", encoding="utf-8").write(texto[:400])
          print(f"FINAL {os.path.getsize('/tmp/processed_reel.mp4')} bytes - VELOZ e DUBLADO TOTAL")
          PY
          python /tmp/dubla.py
          ls -lh /tmp/*.mp4

      - name: 3 - POSTA INSTAGRAM
        env:
          INSTAGRAM_USER: ${{ secrets.INSTAGRAM_USER }}
          INSTAGRAM_PASS: ${{ secrets.INSTAGRAM_PASS }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        continue-on-error: true
        run: |
          cat > /tmp/ig.py << 'PY'
          import os
          from instagrapi import Client
          texto=open("/tmp/legenda.txt", encoding="utf-8").read()[:180]
          caption=f"{texto}\n\n¿Del 1 al 10? 👇\n#construccion #fcconstruye"
          cl=Client(); cl.delay_range=[1,3]
          try:
            sid=os.getenv("IG_SESSIONID","").strip()
            if sid: cl.login_by_sessionid(sid)
            else: cl.login(os.getenv("INSTAGRAM_USER"), os.getenv("INSTAGRAM_PASS"))
          except:
            cl.login(os.getenv("INSTAGRAM_USER"), os.getenv("INSTAGRAM_PASS"))
          cl.clip_upload("/tmp/processed_reel.mp4", caption, thumbnail="/tmp/thumb.jpg")
          print("IG OK")
          PY
          python /tmp/ig.py

      - name: 4 - POSTA FACEBOOK
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        continue-on-error: true
        run: |
          cat > /tmp/fb.py << 'PY'
          import os, requests
          page=os.getenv("FB_PAGE_ID").strip()
          token=os.getenv("FB_PAGE_TOKEN").strip()
          legenda=open("/tmp/legenda.txt", encoding="utf-8").read()[:300]
          file_path="/tmp/processed_reel.mp4"
          url=f"https://graph-video.facebook.com/v20.0/{page}/videos"
          with open(file_path,"rb") as f:
              r=requests.post(url, data={"description": legenda,"access_token": token}, files={"source": f}, timeout=300)
              print(f"FB {r.status_code} {r.text[:1000]}")
          PY
          python /tmp/fb.py

      - name: 5 - POSTA YOUTUBE SHORTS
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        continue-on-error: true
        run: |
          cat > /tmp/yt.py << 'PY'
          import os, requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          cid=os.getenv("YT_CLIENT_ID").strip(); csec=os.getenv("YT_CLIENT_SECRET").strip(); rtok=os.getenv("YT_REFRESH_TOKEN").strip()
          resp=requests.post("https://oauth2.googleapis.com/token", data={"client_id":cid,"client_secret":csec,"refresh_token":rtok,"grant_type":"refresh_token"}).json()
          creds=Credentials(token=resp["access_token"], refresh_token=rtok, client_id=cid, client_secret=csec, token_uri="https://oauth2.googleapis.com/token")
          youtube=build("youtube","v3",credentials=creds)
          legenda=open("/tmp/legenda.txt", encoding="utf-8").read()
          body={"snippet":{"title":legenda[:85]+" #shorts","description":legenda+"\n#construccion #shorts","categoryId":"27"},"status":{"privacyStatus":"public"}}
          youtube.videos().insert(part="snippet,status", body=body, media_body=MediaFileUpload("/tmp/processed_reel.mp4", mimetype="video/mp4", resumable=True)).execute()
          print("YT OK")
          PY
          python /tmp/yt.py

      - name: 6 - Salva historico
        run: |
          git config user.name "fc-bot"
          git config user.email "bot@fcconstruye.com"
          git add historico_4redes.json || true
          git commit -m "post veloz $(date -u)" || true
          git push || true
