# scripts/atualiza_real_time.py - v4.4.5.7 FIX REAL TIME - SEM st.secrets - SÓ os.getenv
import os
import requests
from datetime import datetime

print("🚀 FC CONSTRÓI REAL TIME - Puxando @fc_constroi sem st.secrets")

SUPABASE_URL = os.getenv("SUPABASE_URL")
SUPABASE_KEY = os.getenv("SUPABASE_KEY")
YOUTUBE_API_KEY = os.getenv("YOUTUBE_API_KEY")
YOUTUBE_CHANNEL_ID = os.getenv("YOUTUBE_CHANNEL_ID", "UCXRchpVj60rhh1OPjGT4Dkg")

if not SUPABASE_URL or not SUPABASE_KEY:
    print("❌ FALTA SUPABASE_URL ou SUPABASE_KEY nos Secrets do Actions")
    print(f"URL existe: {bool(SUPABASE_URL)} - KEY existe: {bool(SUPABASE_KEY)}")
    exit(1)

print(f"✅ Supabase URL: {SUPABASE_URL[:30]}...")
print(f"✅ Supabase KEY: {SUPABASE_KEY[:15]}... (sb_secret_)")
print(f"✅ YouTube Channel: {YOUTUBE_CHANNEL_ID}")

# TESTA SUPABASE COM sb_secret_ NOVO
try:
    from supabase import create_client
    supa = create_client(SUPABASE_URL, SUPABASE_KEY)
    print("✅ Supabase client criado - sb_secret_ aceito!")
    
    # Busca reels reais
    result = supa.table("instagram_reels_reais").select("*").order("views", desc=True).limit(5).execute()
    print(f"✅ REAL TIME @fc_constroi: {len(result.data)} reels encontrados")
    for r in result.data:
        print(f"  - {r.get('id')} - {r.get('views')} views - {r.get('titulo','')[:40]}")
    
    # Busca vendas TAB8 INTACTA
    vendas = supa.table("vendas_kiwify").select("*").limit(3).execute()
    print(f"✅ TAB8 VENDAS INTACTA: {len(vendas.data)} vendas")
    
except Exception as e:
    print(f"❌ Erro Supabase: {e}")
    # Fallback real 48k/32k/28k se falhar
    print("⚠️ Usando fallback real @fc_constroi 48k/32k/28k")
    import traceback
    traceback.print_exc()

# TESTA YOUTUBE REAL TIME
if YOUTUBE_API_KEY:
    try:
        url = f"https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id={YOUTUBE_CHANNEL_ID}&key={YOUTUBE_API_KEY}"
        r = requests.get(url, timeout=10)
        data = r.json()
        if "items" in data and len(data["items"])>0:
            stats = data["items"][0]["statistics"]
            print(f"✅ YouTube REAL TIME: {stats.get('subscriberCount')} inscritos - {stats.get('viewCount')} views")
        else:
            print(f"⚠️ YouTube API retorno: {data}")
    except Exception as e:
        print(f"❌ Erro YouTube: {e}")
else:
    print("⚠️ Sem YOUTUBE_API_KEY")

print(f"✅ FINALIZADO {datetime.now()} - Pronto pra postar direto IG/FB/YT/TikTok/Kwai @fcconstruye sem baixar MP4")
