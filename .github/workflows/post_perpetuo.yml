name: post_perpetuo
on: workflow_dispatch
jobs:
  post_perpetuo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg -qq
          pip install requests yt-dlp edge-tts openai-whisper deep-translator -q

      - name: Baixa, DUBLA MEXICO gratis e LEGENDA e posta @fcconstruye
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          python - << 'PY'
          import os, requests, subprocess, glob, json
          import whisper
          from deep_translator import GoogleTranslator
          import asyncio
          import edge_tts

          SUPA_URL=os.getenv("SUPABASE_URL")
          SUPA_KEY=os.getenv("SUPABASE_KEY")
          PAGE_ID=os.getenv("PAGE_ID")
          PAGE_TOKEN=os.getenv("PAGE_TOKEN")
          COOKIES=os.getenv("IG_COOKIES","")
          open('/tmp/cookies.txt','w').write(COOKIES)

          # 1. PEGA URL DO SUPABASE
          headers={"apikey": SUPA_KEY, "Authorization": f"Bearer {SUPA_KEY}"}
          r=requests.get(f"{SUPA_URL}/rest/v1/instagram_reels_reais?select=*&order=score.desc&limit=1", headers=headers, timeout=20)
          reel=r.json()[0]
          insta_url=reel.get('url')
          print(f"URL: {insta_url}")

          # 2. BAIXA VIDEO
          subprocess.run(["yt-dlp","--cookies","/tmp/cookies.txt","-o","/tmp/video.%(ext)s","--no-playlist", insta_url], timeout=90)
          fpath=glob.glob("/tmp/video.*")[0]
          print(f"Baixado: {fpath}")

          # 3. EXTRAI AUDIO PRA TRANSCREVER
          subprocess.run(["ffmpeg","-y","-i",fpath,"-vn","-acodec","pcm_s16le","-ar","16000","/tmp/audio.wav"], check=True)

          # 4. TRANSCREVE COM WHISPER (GRATIS)
          print("Transcrevendo PT com Whisper tiny (gratis)...")
          model = whisper.load_model("tiny")
          result = model.transcribe("/tmp/audio.wav", language="pt")
          texto_pt = result["text"].strip()
          print(f"Texto PT: {texto_pt}")
          if not texto_pt:
              texto_pt = "Armario de cozinha planejado com porcelanato. Olha esse acabamento."

          # 5. TRADUZ PRA ESPANHOL MEXICANO (GRATIS)
          print("Traduzindo pra es-MX...")
          try:
              texto_es = GoogleTranslator(source='pt', target='es').translate(texto_pt)
          except:
              texto_es = texto_pt
          print(f"Texto ES-MX: {texto_es}")

          # 6. GERA LEGENDA SRT (GRATIS)
          srt_content = f"1\n00:00:00,000 --> 00:00:15,000\n{texto_es}\n"
          open("/tmp/legenda.srt","w", encoding="utf-8").write(srt_content)

          # 7. DUBLA COM VOZ MEXICANA GRATIS (Edge TTS)
          print("Gerando dublagem es-MX-JorgeNeural (gratis)...")
          async def gen_tts():
              communicate = edge_tts.Communicate(texto_es, "es-MX-JorgeNeural")
              await communicate.save("/tmp/audio_es.mp3")
          asyncio.run(gen_tts())
          print(f"Audio ES gerado: {os.path.getsize('/tmp/audio_es.mp3')} bytes")

          # 8. JUNTA VIDEO + AUDIO NOVO + LEGENDA QUEIMADA
          print("Muxando video com dublagem e legenda...")
          # Primeiro troca audio
          subprocess.run(["ffmpeg","-y","-i",fpath,"-i","/tmp/audio_es.mp3","-map","0:v","-map","1:a","-c:v","copy","-shortest","/tmp/temp_dub.mp4"], check=True)
          # Depois queima legenda
          subprocess.run(["ffmpeg","-y","-i","/tmp/temp_dub.mp4","-vf","subtitles=/tmp/legenda.srt:force_style='FontSize=24,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=3,Outline=2'", "-c:a","copy","/tmp/video_final.mp4"], check=True)

          final_video="/tmp/video_final.mp4"
          print(f"FINAL: {os.path.getsize(final_video)} bytes - 100% dublado e legendado!")

          # 9. POSTA NO FACEBOOK
          desc = f"{texto_es}\n\n#fcconstruye #cocina #mexico"
          with open(final_video,'rb') as f:
              fb=requests.post(f"https://graph.facebook.com/v20.0/{PAGE_ID}/videos", data={"description": desc, "access_token": PAGE_TOKEN}, files={"source": f}, timeout=300)
          print(f"FACEBOOK: {fb.status_code}")
          print(fb.text[:1500])
          print("✅ POSTOU 100% GRATIS MEXICANO DUBLADO + LEGENDADO @fcconstruye !!!")
          PY
