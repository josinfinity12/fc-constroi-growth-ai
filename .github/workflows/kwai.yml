name: Postar no Kwai

on:
  workflow_dispatch:
    inputs:
      video:
        description: 'Nome do video'
        required: false
        default: 'video_final.mp4'

jobs:
  post-kwai:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          
      - name: Rodar Bot Kwai
        run: python kwai_uploader.py
        env:
          KWAI_COOKIES: ${{ secrets.KWAI_COOKIES }}
